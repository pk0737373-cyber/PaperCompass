    const parseSrc = (src) => {
      const a = [];
      src.split(/(?<=\(\d{4}\))\s*,\s*/).forEach(p => {
        const c = p.trim().replace(/^SVU:\s*/, '').replace(/^타교:\s*/, '').replace(/\s*외\s*\d*편?$/, '').replace(/\s*\/\s*$/, '').trim();
        if (c.length > 3 && /\(\d{4}\)/.test(c)) a.push(c);
      });
      return a;
    };
    Object.entries(researchPairDB).forEach(([key, val]) => {
      const arrow = key.indexOf('→');
      if (arrow < 0) return;
      const iv = key.substring(0, arrow);
      if (!ivSvu[iv]) { ivSvu[iv] = new Set(); ivExt[iv] = new Set(); }
      const src = val.sources || '';
      const sp = src.match(/SVU:\s*([^/]*)/);
      const ep = src.match(/타교:\s*([^/]*)/);
      if (sp) parseSrc(sp[1]).forEach(a => ivSvu[iv].add(a));
      if (ep) parseSrc(ep[1]).forEach(a => ivExt[iv].add(a));
      if (!sp && !ep) parseSrc(src).forEach(a => ivExt[iv].add(a));
    });
    svuIVs = Object.entries(ivSvu).filter(([,s]) => s.size > 0)
      .map(([name,s]) => ({ name, count: s.size, ...(ivMeta[name]||{}) }))
      .sort((a,b) => b.count - a.count);
    const allKeys = new Set([...Object.keys(ivSvu), ...Object.keys(ivExt)]);
    allIVs = [...allKeys].map(name => {
      const sc = (ivSvu[name]||new Set()).size, ec = (ivExt[name]||new Set()).size;
      return { name, svuCount: sc, extCount: ec, total: sc+ec, ...(ivMeta[name]||{}) };
    }).filter(v => v.total > 0).sort((a,b) => b.total - a.total);

  // ── 변수명 별칭 매핑 (복합개념 → 하위변수) ──
  const _varAliases = {
    '조직유효성': ['조직유효성','조직몰입','직무만족','조직성과','직무성과'],
    '신뢰/상사신뢰': ['신뢰','상사신뢰','조직신뢰'],
    '성격/성격5요인': ['성격','성격특성','성격5요인','성격특성(Big5)'],
  };
  const _expandVar = (v) => {
    if (_varAliases[v]) return _varAliases[v];
    // 슬래시 포함 시 분리
    if (v.includes('/')) return v.split('/').map(s => s.trim());

  // ── 슬래시 변수명 퍼지 매칭 헬퍼 ──
  // "신뢰/상사신뢰" → researchPairDB에서 "신뢰→X", "상사신뢰→X", "조직신뢰→X" 등 모두 검색
  // 단순 키("IV→DV") 기반 래퍼 - researchPairDB[key] 대신 사용
  const _getPairByKey = (key) => {
    if (researchPairDB[key]) return researchPairDB[key];
    const parts = key.split('→');
    if (parts.length !== 2) return null;
    const lookup = _lookupPairDB(parts[0], parts[1]);
    return lookup ? lookup.data : null;
  };
  const _lookupPairDB = (fromVar, toVar) => {
    // 1) 정확한 키 먼저 시도 (슬래시 없는 단순 변수일 때만 즉시 반환)
    const exactKey = `${fromVar}→${toVar}`;
    if (!fromVar.includes('/') && !toVar.includes('/') && researchPairDB[exactKey]) {
      return { key: exactKey, data: researchPairDB[exactKey] };
    }

    // 2) 별칭/슬래시 분리 후 각 파트로 시도 + 부분문자열 매칭
    const fromParts = _expandVar(fromVar);
    const toParts = _expandVar(toVar);
    const allKeys = Object.keys(researchPairDB);
    const matchedEntries = [];
    const addEntry = (k) => { if (!matchedEntries.some(e => e.key === k)) matchedEntries.push({ key: k, data: researchPairDB[k] }); };

    for (const fp of fromParts) {
      for (const tp of toParts) {
        // 정확한 키 시도
        const tryKey = `${fp}→${tp}`;
        if (researchPairDB[tryKey]) addEntry(tryKey);
        // DB 키 전체 스캔: 부분문자열 매칭 (예: "신뢰" → "조직신뢰", "상사신뢰" 등)
        for (const dbKey of allKeys) {
          const arr = dbKey.split('→');
          if (arr.length !== 2) continue;
          const [dbIv, dbDv] = arr;
          const ivMatch = dbIv === fp || (fp.length >= 2 && (dbIv.includes(fp) || fp.includes(dbIv)));
          const dvMatch = dbDv === tp || (tp.length >= 2 && (dbDv.includes(tp) || tp.includes(dbDv)));
          if (ivMatch && dvMatch) addEntry(dbKey);
        }
      }
    }

    if (matchedEntries.length === 0) return null;
    if (matchedEntries.length === 1) return matchedEntries[0];

    // 여러 매칭 시 병합: sources 합치고, count 합산, 가장 강한 verdict 사용
    const verdictRank = { strong: 4, moderate: 3, weak: 2, emerging: 1, none: 0 };
    let totalCount = 0, bestVerdict = 'none';
    const seenSources = new Set();
    const mergedSources = [];
    for (const entry of matchedEntries) {
      totalCount += entry.data.count;
      if ((verdictRank[entry.data.verdict] || 0) > (verdictRank[bestVerdict] || 0)) bestVerdict = entry.data.verdict;
      // sources 파싱: "/" 구분 → 개별 이름 추출
      const srcStr = entry.data.sources || '';
      srcStr.split('/').forEach(seg => {
        seg = seg.trim();
        if (!seg) return;
        const clean = seg.replace(/^(SVU:|타교:)\s*/, '').trim();
        clean.split(/(?<=\(\d{4}\))\s*,\s*/).forEach(name => {
          const n = name.trim();
          if (n && n.length > 2 && /\(\d{4}\)/.test(n) && !seenSources.has(n)) {
            seenSources.add(n);
            mergedSources.push(n);
          }
        });
      });
    }
    return { key: matchedEntries.map(e => e.key).join('+'), data: { count: totalCount, sources: mergedSources.join(', '), verdict: bestVerdict }, merged: true };
  };

    if (!theory) return [];
    const indices = selectedSubFactors[varName] || theory.defaultSelected;
    return indices.map(i => theory.options[i]).filter(Boolean);
  };

  const toggleSubFactor = (varName, index) => {
    const theory = subFactorTheory[varName];
    if (!theory) return;
    // 초기화 요청
    if (index === -1) {
      setSelectedSubFactors({ ...selectedSubFactors, [varName]: [...theory.defaultSelected] });
      return;
    }
    const current = selectedSubFactors[varName] || theory.defaultSelected;
    const newSelected = current.includes(index)
      ? current.filter(i => i !== index)
      : [...current, index].sort((a, b) => a - b);
    // 하위요인 0개도 허용 (단일 차원 측정 변수 지원)
    setSelectedSubFactors({ ...selectedSubFactors, [varName]: newSelected });
  };

    const theory = subFactorTheory[varName];
    if (!theory) return null;
    const indices = selectedSubFactors[varName] || theory.defaultSelected;

    const defaultCount = Math.min(5, totalItems);
    return Array.from({length: defaultCount}, (_, i) => i);

      : [...current, itemIdx].sort((a,b) => a-b);
    if (newSelected.length === 0) return; // 최소 1개 유지
    setSelectedItems({...selectedItems, [key]: newSelected});

  // ── 참고문헌 키 추출 헬퍼 (sources 문자열 → author key Set) ──
  const parseSourceKeys = (src) => {
    const keys = new Set();
    // '/' 기준으로 개별 논문 구분
    src.split('/').forEach(rawSeg => {
      // 1) 공백 제거 후 'SVU:' / '타교:' 접두사 제거
      let seg = rawSeg.trim().replace(/^(SVU:|타교:)\s*/i, '').trim();
      if (!seg || /다수/.test(seg)) return;
      // 2) 뒤에 붙은 '외 N편' / '외 N' / '외' 제거
      seg = seg.replace(/\s*외\s*\d+\s*편?\s*$/, '').replace(/\s*외\s*$/, '').trim();
      if (!seg) return;

      // 3a) 한국어 저자 패턴: '홍길동, 이름(2021)' or '홍길동(2021)' or '홍길동 외(2021)'
      // '외'는 한글 문자이므로 저자명 패턴에서 제외해야 함
      // korPat: 저자명(첫 저자)만 캡처하고 ' 외(year)'도 처리
      const korPat = /([가-힣]+(?:(?:[,·\s]+[가-힣]+)*|(?:\s+외))?)(\([12]\d{3}\))/g;
      let m;
      let found = false;
      while ((m = korPat.exec(seg)) !== null) {
        found = true;
        let authorPart = m[1].trim();
        const yearPart = m[2]; // e.g. '(2021)'
        // ' 외' 포함된 경우: '조원희 외' → '조원희'만 추출
        const withOwei = authorPart.match(/^([가-힣]+)\s+외$/);
        if (withOwei) {
          authorPart = withOwei[1]; // '조원희'
        }
        const key = authorPart + yearPart; // '조원희(2020)'
        // '외' 단독이 저자로 남으면 제외
        if (authorPart === '외' || authorPart.length === 0) continue;
        keys.add(key);
        // 공동저자 중 마지막 저자 alias: '박지영, 김미경(2021)' → '김미경(2021)'
        const lastPart = authorPart.match(/,\s*([가-힣]+)$/);
        if (lastPart) keys.add(lastPart[1] + yearPart);
      }

      // 3b) 영문 저자 패턴: 'Smith et al.(year)', 'Smith&Jones(year)', 'Smith & Jones(year)'
      const engPat = /[A-Z][a-zA-Z'\-]+(?:(?:\s*[&]\s*|-)[A-Z]?[a-zA-Z'\-]+)?(?:\s+et\s+al\.?)?\([12]\d{3}\)/g;
      while ((m = engPat.exec(seg)) !== null) {
        found = true;
        const raw = m[0];
        keys.add(raw);
        // '&' 주변 공백 정규화: 'Detert & Burris(2007)' → 'Detert&Burris(2007)'
        const norm = raw.replace(/\s*&\s*/g, '&');
        if (norm !== raw) keys.add(norm);
      }

      // 3c) 어떤 패턴도 못 찾으면, (year) 패턴이 있을 때만 그대로 추가
      if (!found && /\([12]\d{3}\)/.test(seg)) keys.add(seg);
    });
    return keys;
  };

    '긍정심리자본→조직몰입': '긍정심리자본은 조직몰입에 정(+)의 영향을 미치는 것으로 나타났다(임재규, 2017). 긍정적 심리적 역량이 조직에 대한 헌신을 높이는 것으로 확인되었다.',

  // ── 선행연구 요약문 생성 함수 ──
  const getPriorResearchSummary = (fromVar, toVar) => {
    const key = `${fromVar}→${toVar}`;
    if (priorResearchSummaryDB[key]) return priorResearchSummaryDB[key];
    // 자동 생성 (퍼지 매칭 사용)
    const lookup = _lookupPairDB(fromVar, toVar);
    const pairData = lookup ? lookup.data : null;
    if (pairData) {
      const isNegDV = _negativeDVs.has(toVar);
      const dirLabel = pairData.verdict === 'strong' || pairData.verdict === 'moderate' ? (isNegDV ? '부(-)' : '정(+)') : '유의한';
      return `${fromVar}은(는) ${toVar}에 ${dirLabel} 영향을 미치는 것으로 선행연구에서 보고되었다(${pairData.sources.split('/')[0].replace('SVU: ', '').split(' 외')[0]}). 총 ${pairData.count}편의 연구에서 두 변수 간 관계가 검증되었다.`;
    }
    return `${fromVar}과(와) ${toVar}의 관계에 대한 선행연구는 아직 충분하지 않으며, 본 연구를 통해 탐색적으로 검증할 필요가 있다.`;
};

  // ── 선행연구표 데이터 추출 함수 ──
  const getPriorResearchTableData = (fromVar, toVar) => {
    const lookup = _lookupPairDB(fromVar, toVar);
    const pairData = lookup ? lookup.data : null;
    if (!pairData) return [];

    // sources 문자열 파싱: "SVU: 박인규(2023), 전광종(2021) 외 3편 / 타교: Bass(1985), Wang(2017) 외"
    // 복수 저자 "김학선, 변정우(2019)" 패턴도 올바르게 처리
    const parseSourcesString = (sourcesStr) => {
      const sections = sourcesStr.split('/').map(s => s.trim());
      const allNames = [];
      sections.forEach(section => {
        let clean = section.replace(/^SVU:\s*/, '').replace(/^타교:\s*/, '').replace(/^\s*타교:\s*/g, '');
        clean = clean.replace(/\s*외\s*\d*편?$/, '').replace(/\s*외\s*다수$/, '').replace(/\s*외$/, '');
        // "(YYYY)" 뒤의 쉼표로 분리 — "김학선, 변정우(2019)" 같은 복수 저자명 보존
        const parts = clean.split(/(?<=\(\d{4}\))\s*,\s*/);
        parts.forEach(p => {
          const trimmed = p.trim();
          if (trimmed.length > 3 && /\(\d{4}\)/.test(trimmed)) allNames.push(trimmed);
        });
      });
      return allNames;
    };

    const researchers = [...new Set(parseSourcesString(pairData.sources))];
    const tableRows = [];

    researchers.forEach(name => {
      const paperDetail = paperDetailDB[name];
      if (paperDetail) {
        tableRows.push({
          region: paperDetail.region,
          researcher: name,
          subject: paperDetail.subject,
          sample: paperDetail.sample,
          iv: paperDetail.iv,
          mv: paperDetail.mv || '-',
          dv: paperDetail.dv,
          result: paperDetail.result,
        });
      } else {
        // paperDetailDB에 없어도 최소 정보로 행 생성
        const isKorean = /[가-힣]/.test(name);
        tableRows.push({
          region: isKorean ? '국내' : '국외',
          researcher: name,
          subject: '-',
          sample: '-',
          iv: fromVar,
          mv: '-',
          dv: toVar,
          result: '(상세정보 미등록)',
        });
      }
    });

    // 사용자 DB에서 해당 변수 쌍과 매칭되는 논문 추가
    const seenResearchers = new Set(researchers.map(r => r.trim()));
    try {
      const userPapers = (typeof getDB === 'function') ? getDB() : [];
      userPapers.forEach(p => {
        // ── (A) 논문 자체의 변수 매칭 ──
        const vars = (p.variables || []).filter(v => v.name);
        const varNames = vars.map(v => v.name);
        const hasFrom = varNames.some(n => n === fromVar || fromVar.includes(n) || n.includes(fromVar));
        const hasTo = varNames.some(n => n === toVar || toVar.includes(n) || n.includes(toVar));
        if (hasFrom && hasTo) {
          const authorKey = `${p.authors || '?'}(${p.year || '?'})`;
          if (!seenResearchers.has(authorKey)) {
            seenResearchers.add(authorKey);
            const ivVars = vars.filter(v => v.role === '독립').map(v => v.name).join(', ') || '-';
            const mvVars = vars.filter(v => v.role === '매개').map(v => v.name).join(', ') || '-';
            const dvVars = vars.filter(v => v.role === '종속').map(v => v.name).join(', ') || '-';
            tableRows.push({
              region: '국내',
              researcher: authorKey,
              subject: p.title || '-',
              sample: p.sampleSize ? `${p.sampleSize}명` : '-',
              iv: ivVars,
              mv: mvVars,
              dv: dvVars,
              result: `${fromVar} → ${toVar} 관계 연구 (사용자DB)`,
              fromUserDB: true,
            });
          }
        }

        // ── (B) PDF에서 추출된 선행연구 표 데이터 병합 ──
        const priorStudies = p.priorStudies || [];
        priorStudies.forEach(study => {
          // 변수명 부분 매칭: "자기효능감" ⊂ fromVar 또는 fromVar ⊂ study.fromVar
          const matchFrom = study.fromVar === fromVar || fromVar.includes(study.fromVar) || study.fromVar.includes(fromVar);
          const matchTo = study.toVar === toVar || toVar.includes(study.toVar) || study.toVar.includes(toVar);
          if (!matchFrom || !matchTo) return;
          (study.entries || []).forEach(entry => {
            const rKey = entry.researcher.trim();
            if (seenResearchers.has(rKey)) return; // 중복 제외
            seenResearchers.add(rKey);
            tableRows.push({
              region: entry.region || (/[가-힣]/.test(rKey) ? '국내' : '국외'),
              researcher: rKey,
              subject: entry.subject || '-',
              sample: entry.sample || entry.subject || '-',
              iv: entry.iv || fromVar,
              mv: entry.mv || '-',
              dv: entry.dv || toVar,
              result: entry.result || `${fromVar} → ${toVar} 관계 연구`,
              fromPDFExtract: true,
            });
          });
        });
      });
    } catch(e) { /* 사용자 DB 접근 실패 시 무시 */ }

    // 국외 먼저, 그 다음 국내
    tableRows.sort((a, b) => {
      if (a.region === '국외' && b.region === '국내') return -1;
      if (a.region === '국내' && b.region === '국외') return 1;
      return 0;
    });

    return tableRows;
  };

  // ── 분석방법 상세 가이드 생성 함수 ──

    const steps = [

        tip: '하위요인별로 각각 신뢰도를 산출해야 합니다. 전체 변수 단위로만 하면 심사에서 지적받을 수 있습니다.',

      {

        method: '탐색적 요인분석(EFA) + 확인적 요인분석(CFA)',
        tool: 'SPSS(EFA) → 분석 → 차원축소 → 요인분석',
        detail: `탐색적 요인분석(EFA)을 통해 측정 문항의 요인 구조를 확인한다. 주성분분석(PCA), Varimax 회전, 고유값 1.0 이상 기준을 적용한다. KMO ≥ .70, Bartlett 구형성 검정 p < .05, 요인적재량 ≥ .50을 기준으로 한다.${!isMaster ? ' 이후 확인적 요인분석(CFA)을 통해 모형적합도(χ²/df < 3.0, CFI ≥ .90, RMSEA ≤ .08)를 확인한다.' : ''}`,
        tip: '요인적재량이 .50 미만인 문항은 삭제를 고려하세요. 교차적재(cross-loading)가 있는 문항도 확인해야 합니다.',
      },
      {
        name: '4단계: 상관관계 분석',
        method: 'Pearson 상관분석',
        tool: 'SPSS → 분석 → 상관분석 → 이변량 상관',
        detail: `변수 간 관계의 방향성과 강도를 파악하기 위해 Pearson 상관분석을 실시한다. 상관계수가 |r| ≥ .80이면 다중공선성을 의심해야 한다. 판별타당도 확인을 위해 AVE의 제곱근이 상관계수보다 커야 한다.`,
        tip: '상관분석 결과표를 논문에 반드시 포함하세요. 대각선 아래는 상관계수, 대각선에는 AVE 제곱근을 표시합니다.',
      },
      {
        name: '5단계: 가설 검증 (회귀분석)',
        method: medCount > 0
          ? `다중회귀분석 + ${isMaster ? 'PROCESS Macro (Model 4)' : 'SmartPLS 구조방정식'}`
          : '다중회귀분석',
        tool: medCount > 0 && isMaster
          ? 'SPSS → PROCESS Macro v4.x → Model 4 (단순매개) 또는 Model 6 (이중매개)'
          : isMaster ? 'SPSS → 분석 → 회귀분석 → 선형' : 'SmartPLS 4.0 → PLS-SEM',
        detail: medCount > 0 && isMaster
          ? `매개효과 검증을 위해 Hayes(2018)의 PROCESS Macro를 사용한다.\n\n• 단순매개: Model 4 (매개변수 ${medCount}개를 병렬로 투입)\n• 이중매개: Model 6 (매개변수를 순차적으로 투입)\n• Bootstrap 5,000회, 95% 신뢰구간 기준으로 간접효과의 유의성을 검증한다.\n• 신뢰구간에 0이 포함되지 않으면 매개효과가 유의한 것으로 판단한다.\n\n[PROCESS 설정]\n- Y(종속): ${selectedDV}\n- X(독립): ${selectedIV}\n- M(매개): ${selectedMediators.join(', ')}\n- Bootstrap samples: 5000\n- Confidence interval: 95%`
          : `${selectedIV}이(가) ${selectedDV}에 미치는 영향을 검증하기 위해 다중회귀분석을 실시한다. 통제변수(인구통계학적 변수)를 1단계에 투입하고, 독립변수를 2단계에 투입하는 위계적 회귀분석을 실시한다.`,
        tip: medCount > 0
          ? `PROCESS Macro는 SPSS에 별도 설치가 필요합니다. processmacro.org에서 무료 다운로드 가능합니다. Model 번호를 정확히 선택하는 것이 중요합니다.`
          : 'VIF(분산팽창인수)가 10 이상이면 다중공선성 문제가 있으므로 확인이 필요합니다.',
      },
    ];

    if (medCount > 0) {
      steps.push({
        name: '6단계: 매개효과 유의성 검증',
        method: 'Sobel Test + Bootstrap 간접효과',
        tool: isMaster ? 'PROCESS Macro 결과표' : 'SmartPLS → Bootstrapping',
        detail: `총효과(Total Effect) = 직접효과(Direct Effect) + 간접효과(Indirect Effect)\n\n• 직접효과: ${selectedIV} → ${selectedDV} (c' 경로)\n• 간접효과: ${selectedIV} → ${selectedMediators.join('/')} → ${selectedDV} (a×b 경로)\n• 완전매개: 직접효과 비유의, 간접효과 유의\n• 부분매개: 직접효과 유의, 간접효과 유의\n\nBootstrap 95% CI에 0이 포함되지 않으면 매개효과 유의`,
        tip: '논문에서 총효과, 직접효과, 간접효과를 모두 표로 정리하여 제시해야 합니다.',
      });
    }

    return { steps, tool, summary: `본 연구에서는 ${tool}을 활용하여 ${steps.length}단계 분석을 실시한다.` };
  };

  // ── 표본크기 산출 근거 함수 ──
  const getSampleSizeJustification = () => {
    const varCount = getSurveyVariables().length;
    const totalItems = countSurveyItems();
    const subFactorCount = getSurveyVariables().reduce((sum, v) => {
      return sum + getAutoSurveyItemsByFactor(v).length;
    }, 0);

    // 다양한 기준별 권장 표본 크기
    const criteria = [
      { basis: 'Tabachnick & Fidell(2013) 회귀분석 기준', formula: 'N ≥ 50 + 8m (m=독립변수 수)', recommended: 50 + 8 * varCount, note: `m=${varCount}개 변수` },
      { basis: 'Hair et al.(2010) 요인분석 기준', formula: '문항 수 × 5~10배', recommended: Math.max(totalItems * 5, 200), note: `${totalItems}문항 × 5 = ${totalItems * 5}` },
      { basis: 'Kline(2015) 구조방정식 기준', formula: 'N ≥ 200 (중규모 모형)', recommended: 200, note: '경로 수 기반' },
      { basis: 'Nunnally(1978) 신뢰도 분석 기준', formula: '문항당 최소 10명', recommended: Math.max(...getSurveyVariables().map(v => getAutoSurveyItemsByFactor(v).reduce((s, f) => s + f.items.length, 0))) * 10, note: '가장 많은 문항 변수 기준' },
      { basis: 'G*Power 검정력 분석 기준', formula: 'f²=.15, α=.05, Power=.95', recommended: Math.ceil(varCount * 26 + 50), note: `중간 효과크기, 변수 ${varCount}개` },
    ];

  // 논문 PDF 링크 렌더링 함수 (SVU + 타학교 + 인용논문 + 해외논문)
  // 텍스트 내 "저자명(연도)" 패턴을 찾아 PDF가 있으면 클릭 가능한 링크로 변환
  const renderAuthorLinks = (text, style) => {

    // 한글이름(4자리) 또는 영문저자(4자리) 또는 영문&영문(4자리) 패턴
    const regex = /([가-힣]{2,4}|[A-Za-z][A-Za-z&·\.\s]*?)\((\d{4})\)/g;
    const parts = [];
    let lastIndex = 0;
    let match;
    while ((match = regex.exec(text)) !== null) {
      // 매치 이전 텍스트
      if (match.index > lastIndex) {
        parts.push(text.slice(lastIndex, match.index));
      }
      const authorKey = match[1] + '(' + match[2] + ')';
      const pdfPath = svuPdfMap[authorKey];
      if (pdfPath) {
        parts.push(h('a', {
          key: 'pdf-' + match.index,
          href: encodeURI(pdfPath),
          target: '_blank',
          rel: 'noopener',
          title: '📄 ' + authorKey + ' 논문 PDF 열기',
          style: { color: '#1565C0', textDecoration: 'underline', cursor: 'pointer', fontWeight: '600' },
          onClick: (e) => { e.stopPropagation(); }
        }, authorKey));
      } else {
        // PDF 원본이 없는 논문 → RISS 검색 링크로 안내
        const isKorean = /[가-힣]/.test(match[1]);
        const searchQuery = isKorean
          ? encodeURIComponent(match[1])
          : encodeURIComponent(match[1]);
        const rissUrl = `https://www.riss.kr/search/Search.do?queryText=znCreator,${searchQuery}&searchGubun=true&colName=bib_t&query=${searchQuery}`;
        parts.push(h('a', {
          key: 'riss-' + match.index,
          href: rissUrl,
          target: '_blank',
          rel: 'noopener',
          title: '🔍 원본 PDF 미보유 논문입니다.\n클릭하면 RISS(한국교육학술정보원)에서\n해당 저자의 논문을 검색합니다.',
          style: { color: '#888', textDecoration: 'underline', textDecorationStyle: 'dotted', cursor: 'pointer', fontSize: 'inherit' },
          onClick: (e) => { e.stopPropagation(); }
        }, authorKey));
      }
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < text.length) {
      parts.push(text.slice(lastIndex));
    }
    // 만약 링크가 하나도 없으면 원래 텍스트 반환
    if (parts.length === 1 && typeof parts[0] === 'string') return text;
    return h('span', style ? { style } : null, ...parts);

  // 산업분류별 SVU 선배논문 필터링 함수

        return [{ factor: varName + ' (단일차원)', scholar: theory.options[0]?.scholar || '', items: allItems }];

  // ── SVU 스타일 연구모형 다이어그램 (SVG) ──
  const ResearchModelSVG = () => {

      let totalMedBlock = 0;

      const headLen = 8;
      return (
        React.createElement("g", {key: `${x1}-${y1}-${x2}-${y2}-${label}`}, React.createElement("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: color, strokeWidth: 1.8, strokeDasharray: dashed ? '6,4' : 'none', markerEnd: "none"}), React.createElement("polygon", {points: `${x2},${y2} ${x2 - headLen * Math.cos(angle - 0.4)},${y2 - headLen * Math.sin(angle - 0.4)} ${x2 - headLen * Math.cos(angle + 0.4)},${y2 - headLen * Math.sin(angle + 0.4)}`, fill: color}), label && (
            React.createElement("text", {x: midX, y: midY - 6, textAnchor: "middle", fontSize: 11, fontWeight: "bold", fill: color}, label)
          ))

    };

    // Build arrows

      // IV → each mediator (generateHypotheses에서 dvCount+1부터)
      const ivMvStart = dvCount + 1;
      meds.forEach((med, i) => {

      const lastDvSubH = lastDvp.subs ? lastDvp.subs.length * 13 + 6 : 0;
      const directY = Math.max(ivY + boxH + ivSubH, lastDvp.y + boxH + lastDvSubH, ...medPositions.map((p, i) => p.y + medBoxH + (medSubs[i].length > 0 ? medSubs[i].length * 13 + 6 : 0))) + 30;
      const directFromX = ivX + boxW / 2;

// ██  통계 분석 엔진  (SPSS 동일 알고리즘, 순수 JS)  ██
// ══════════════════════════════════════════════════════════════
const SF = {
  mean: a => a.reduce((s,v)=>s+v,0)/a.length,
  var: (a,d=1) => { const m=SF.mean(a); return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-d); },
  sd: a => Math.sqrt(SF.var(a)),
  r: (x,y) => {
    const mx=SF.mean(x),my=SF.mean(y);
    const nd=x.reduce((s,v,i)=>s+(v-mx)*(y[i]-my),0);
    const dd=Math.sqrt(x.reduce((s,v)=>s+(v-mx)**2,0)*y.reduce((s,v)=>s+(v-my)**2,0));
    return dd?nd/dd:0;
  },
  alpha: items => {
    const k=items.length; if(k<2) return null;
    const tot=items[0].map((_,i)=>items.reduce((s,c)=>s+c[i],0));
    return (k/(k-1))*(1-items.map(c=>SF.var(c)).reduce((s,v)=>s+v,0)/SF.var(tot));
  },
  pval: t => {
    const x=Math.abs(t)/1.4142135;
    const t2=1/(1+0.3275911*x);
    return 2*t2*(0.254829592+t2*(-0.284496736+t2*(1.421413741+t2*(-1.453152027+t2*1.061405429))))*Math.exp(-x*x);
  },
  star: p => p<.001?'***':p<.01?'**':p<.05?'*':'n.s.',
  inv: M => {
    const n=M.length, a=M.map((r,i)=>[...r,...Array(n).fill(0).map((_,j)=>+(i===j))]);
    for(let c=0;c<n;c++){
      let pi=c; for(let r=c+1;r<n;r++) if(Math.abs(a[r][c])>Math.abs(a[pi][c])) pi=r;
      [a[c],a[pi]]=[a[pi],a[c]];
      const d=a[c][c]; if(Math.abs(d)<1e-14) return null;
      a[c]=a[c].map(v=>v/d);
      for(let r=0;r<n;r++) if(r!==c){ const f=a[r][c]; a[r]=a[r].map((v,j)=>v-f*a[c][j]); }
    }
    return a.map(r=>r.slice(n));
  },
  ols: (y,Xs) => {
    const n=y.length, p=Xs.length, pp=p+1;
    const X=y.map((_,i)=>[1,...Xs.map(x=>x[i])]);
    const XTX=Array(pp).fill(0).map((_,i)=>Array(pp).fill(0).map((_,j)=>X.reduce((s,r)=>s+r[i]*r[j],0)));
    const XTy=Array(pp).fill(0).map((_,i)=>X.reduce((s,r,k)=>s+r[i]*y[k],0));
    const inv=SF.inv(XTX); if(!inv) return null;
    const beta=inv.map(r=>r.reduce((s,v,j)=>s+v*XTy[j],0));
    const yH=X.map(r=>r.reduce((s,v,j)=>s+v*beta[j],0));
    const sse=y.reduce((s,v,i)=>s+(v-yH[i])**2,0);
    const ym=SF.mean(y), sst=y.reduce((s,v)=>s+(v-ym)**2,0);
    const r2=1-sse/sst, mse=sse/(n-p-1), f=(sst-sse)/p/mse;
    const se=inv.map((r,i)=>Math.sqrt(Math.max(0,r[i]*mse)));
    const ts=beta.map((b,i)=>se[i]?b/se[i]:0);
    return {beta,r2,adjR2:1-(1-r2)*(n-1)/(n-p-1),f,se,t:ts,p:ts.map(t=>SF.pval(t)),n};
  },
  stdBeta: (y,Xs) => {
    const z=a=>{const m=SF.mean(a),s=SF.sd(a);return a.map(v=>s?(v-m)/s:0);};
    return SF.ols(z(y),Xs.map(z));
  },
  sobel: (a,b,sa,sb) => (sa&&sb)?(a*b)/Math.sqrt(b*b*sa*sa+a*a*sb*sb):0,
};

// ██  MODE 3: 설문 결과 통계 검토 (v3 — Model-First Flow)  ██
// ══════════════════════════════════════════════════════════════
const StatsAnalyzer = ({ onBack }) => {
  // Stage: upload → results
  const [stage, setStage] = useState('upload');
  const [tool, setTool] = useState('spss');

  // Data
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState('');
  const [demoVars, setDemoVars] = useState([]);
  const [autoGroups, setAutoGroups] = useState([]);
  const [groupRoles, setGroupRoles] = useState({});  // groupId → 'iv'|'med'|'mod'|'dv'|null

  // Thesis title
  const [thesisTitle, setThesisTitle] = useState('');
  const [parsedVars, setParsedVars] = useState(null); // {iv:[], med:[], mod:[], dv:[]}

  // Results
  const [result, setResult] = useState(null);
  const [activeTab, setActiveTab] = useState('desc');
  const [dragOver, setDragOver] = useState(false);
  const [copyMsg, setCopyMsg] = useState('');

  // ─── Title parser: extract variables & roles from thesis title ──
  const parseTitleVars = (title) => {
    if(!title.trim()) return null;
    const t = title.trim();
    const vars = {iv:[], med:[], mod:[], dv:[]};
    // Split compound variables: "A와 B", "A과 B", "A, B", "A·B", "A 및 B"
    const splitVars = (s) => s.split(/[,·]|와\s|과\s|및\s|\s및\s/).map(v=>v.trim()).filter(v=>v&&v.length>1&&v.length<20);

    // Pattern: "X의 조절효과" or "X의 조절된 매개효과" → mod
    const modMatch = t.match(/([^에서의]+?)의\s*조절(?:된\s*매개)?효과/);
    if(modMatch) vars.mod.push(...splitVars(modMatch[1]));
    // Also: "X의 조절효과" at the end
    const modMatch2 = t.match(/[:：\-]\s*([^:：\-]+?)의\s*조절/);
    if(modMatch2 && vars.mod.length===0) vars.mod.push(...splitVars(modMatch2[1]));

    // Pattern: "X의 매개효과" → med
    const medMatch = t.match(/([^에서의]+?)의\s*매개효과/);
    if(medMatch) vars.med.push(...splitVars(medMatch[1]));
    // Also: "X를 매개로", "X을 매개로", "X를 통하여"
    const medMatch2 = t.match(/([^이가은는]+?)[을를]\s*(?:매개로|통하여|통해)/);
    if(medMatch2 && vars.med.length===0) vars.med.push(...splitVars(medMatch2[1]));

    // Pattern: "A가 B에 미치는 영향" or "A이 B에 미치는"
    const mainMatch = t.match(/([^,.:：]+?)[이가은는]\s+([^,.:：]+?)에\s*미치는/);
    if(mainMatch){
      vars.iv.push(...splitVars(mainMatch[1]));
      vars.dv.push(...splitVars(mainMatch[2]));
    }
    // Pattern: "A와 B의 관계" or "A과 B 관계"
    if(vars.iv.length===0){
      const relMatch = t.match(/([^,.:：]+?)[와과]\s+([^,.:：]+?)(?:의\s*)?(?:관계|간의|간에)/);
      if(relMatch){
        vars.iv.push(...splitVars(relMatch[1]));
        vars.dv.push(...splitVars(relMatch[2]));
      }
    }

    // Remove any med/mod vars from IV/DV lists (they were misidentified)
    const medModNames = [...vars.med,...vars.mod];
    vars.iv = vars.iv.filter(v=>!medModNames.some(m=>v.includes(m)||m.includes(v)));
    vars.dv = vars.dv.filter(v=>!medModNames.some(m=>v.includes(m)||m.includes(v)));

    // Clean up: remove particles and trailing junk
    const clean = s => s.replace(/[의이가은는을를에와과]\s*$/,'').replace(/^\s*[의이가은는을를에와과]/,'').trim();
    Object.keys(vars).forEach(k => { vars[k] = vars[k].map(clean).filter(v=>v.length>1); });

    const total = vars.iv.length+vars.med.length+vars.mod.length+vars.dv.length;
    return total>0 ? vars : null;
  };

  const applyTitleVars = () => {
    const pv = parseTitleVars(thesisTitle);
    if(!pv || autoGroups.length===0) return;
    setParsedVars(pv);
    // Auto-match parsed variable names to auto-detected groups
    const newRoles = {...groupRoles};
    const matchGroup = (varName) => {
      // Exact match first
      const exact = autoGroups.find(g=>g.name===varName);
      if(exact) return exact.id;
      // Partial match
      const partial = autoGroups.find(g=>g.name.includes(varName)||varName.includes(g.name));
      if(partial) return partial.id;
      return null;
    };
    ['iv','med','mod','dv'].forEach(role=>{
      pv[role].forEach(vn=>{
        const gid = matchGroup(vn);
        if(gid && !newRoles[gid]) newRoles[gid] = role;
      });
    });
    setGroupRoles(newRoles);
  };

  // ─── Role helpers ─────────────────────────────────
  const assignRole = (groupId, role) => {
    setGroupRoles(prev => {
      if(prev[groupId]===role) { const nm={...prev}; delete nm[groupId]; return nm; }
      return {...prev, [groupId]: role};
    });
  };
  const assignedGroups = autoGroups.filter(g=>groupRoles[g.id]);
  const hasIV = assignedGroups.some(g=>groupRoles[g.id]==='iv');
  const hasDV = assignedGroups.some(g=>groupRoles[g.id]==='dv');
  const hasMed = assignedGroups.some(g=>groupRoles[g.id]==='med');
  const hasMod = assignedGroups.some(g=>groupRoles[g.id]==='mod');
  // Build modelVars-compatible array from autoGroups + groupRoles
  const modelVars = assignedGroups.map(g=>({id:g.id, name:g.name, role:groupRoles[g.id]}));
  const matching = Object.fromEntries(assignedGroups.map(g=>[g.id, g.id]));

  // ─── File parse ───────────────────────────────────
  const parseFile = file => {
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const all = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        const hdrs = (all[0]||[]).map(v=>String(v||'').trim());
        const dataRows = all.slice(1).filter(r=>r&&r.some(v=>v!=null&&v!==''));
        setHeaders(hdrs);
        const numRows = dataRows.map(r=>hdrs.map((_,ci)=>{const v=r[ci]; return (v!=null&&v!=='')?parseFloat(v):NaN;}));
        setRows(numRows);

        // Demo detection
        const demoKw=['성별','연령','나이','학력','소득','직급','경력','기간','age','gender','edu'];
        const demoCols = hdrs.reduce((acc,hd,ci)=>{
          if(demoKw.some(k=>hd.toLowerCase().includes(k))){
            const vals = dataRows.map(r=>r[ci]!=null&&r[ci]!==''?String(r[ci]):'').filter(v=>v!=='');
            const freq={}; vals.forEach(v=>{freq[v]=(freq[v]||0)+1;});
            acc.push({colIdx:ci, name:hd, categories:Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(([val,count])=>({val,count}))});
          }
          return acc;
        },[]);
        setDemoVars(demoCols);

        // Auto-detect groups
        const demoIdx = new Set(demoCols.map(d=>d.colIdx));
        const gMap = {};
        hdrs.forEach((hd,ci)=>{
          if(demoIdx.has(ci)) return;
          if(hd.startsWith('평균')||hd.startsWith('avg')||hd.startsWith('mean')) return;
          if(!hd||hd.trim()==='') return;
          const base = hd.replace(/[\d_\-\.]+$/,'').trim();
          if(!base) return;
          if(!gMap[base]) gMap[base]={name:base,cols:[],id:base};
          gMap[base].cols.push(ci);
        });
        const groups = Object.values(gMap).filter(g=>g.cols.length>=2);
        setAutoGroups(groups);
        setGroupRoles({});
      } catch(ex){ alert('파일 파싱 오류: '+ex.message); }
    };
    reader.readAsArrayBuffer(file);
  };
  const handleDrop = e => { e.preventDefault(); setDragOver(false); const f=e.dataTransfer.files[0]; if(f) parseFile(f); };
  const handleFileInput = e => { const f=e.target.files[0]; if(f) parseFile(f); };

  // ─── Analysis engines ─────────────────────────────
  const buildVarsWithScores = () => {
    return modelVars.filter(mv=>matching[mv.id]).map(mv=>{
      const grp = autoGroups.find(g=>g.id===matching[mv.id]);
      if(!grp) return null;
      const scores = rows.map(row=>{
        const vals=grp.cols.map(ci=>row[ci]).filter(v=>!isNaN(v));
        return vals.length?SF.mean(vals):NaN;
      }).filter(v=>!isNaN(v));
      return {id:mv.id, name:mv.name, role:mv.role, cols:grp.cols, scores};
    }).filter(Boolean);
  };

  const runSPSS = (vars, N, defs) => {
    const ivs=vars.filter(v=>v.role==='iv'), meds=vars.filter(v=>v.role==='med'), mods=vars.filter(v=>v.role==='mod'), dvs=vars.filter(v=>v.role==='dv');
    const descriptive=vars.map(v=>({name:v.name,n:v.scores.length,mean:SF.mean(v.scores),sd:SF.sd(v.scores),min:Math.min(...v.scores),max:Math.max(...v.scores)}));
    const reliability=defs.map(vr=>{
      const items=vr.cols.map(ci=>rows.map(r=>r[ci]).filter(v=>!isNaN(v)));
      const minLen=Math.min(...items.map(it=>it.length));
      const trimmed=items.map(it=>it.slice(0,minLen));
      return {name:vr.name,k:vr.cols.length,alpha:trimmed[0]&&trimmed[0].length>1?SF.alpha(trimmed):null};
    });
    const allVars=[...ivs,...meds,...mods,...dvs];
    const corr=allVars.map(va=>allVars.map(vb=>{
      if(va===vb) return {r:1,p:0};
      const r=SF.r(va.scores,vb.scores);
      const t=r*Math.sqrt((N-2)/(1-r*r));
      return {r,p:SF.pval(t)};
    }));
    const reg={};
    if(ivs.length>0&&dvs.length>0){
      const dv=dvs[0];
      reg.h1={ivNames:ivs.map(v=>v.name),dvName:dv.name,raw:SF.ols(dv.scores,ivs.map(v=>v.scores)),std:SF.stdBeta(dv.scores,ivs.map(v=>v.scores))};
      if(meds.length>0){
        const med=meds[0];
        reg.h2={ivNames:ivs.map(v=>v.name),dvName:med.name,raw:SF.ols(med.scores,ivs.map(v=>v.scores)),std:SF.stdBeta(med.scores,ivs.map(v=>v.scores))};
        reg.h3={ivName:med.name,dvName:dv.name,raw:SF.ols(dv.scores,[med.scores]),std:SF.stdBeta(dv.scores,[med.scores])};
        reg.mediation=ivs.map(iv=>{
          const s1=SF.ols(dv.scores,[iv.scores]),s2=SF.ols(med.scores,[iv.scores]),s3=SF.ols(dv.scores,[iv.scores,med.scores]);
          const a=s2.beta[1],seA=s2.se[1],b=s3.beta[2],seB=s3.se[2];
          const cSig=SF.star(s1.p[1]),aSig=SF.star(s2.p[1]),cPrimeSig=SF.star(s3.p[1]);
          return {iv:iv.name,c:s1.beta[1],seC:s1.se[1],a,seA,b,seB,cPrime:s3.beta[1],sobelZ:SF.sobel(a,b,seA,seB),cSig,aSig,cPrimeSig,
            medType:(cSig!=='n.s.'&&aSig!=='n.s.')?(cPrimeSig==='n.s.'?'완전매개':'부분매개'):'기각'};
        });
      }
      // Moderation analysis: hierarchical regression with interaction terms
      if(mods.length>0){
        reg.moderation=[];
        ivs.forEach(iv=>{
          mods.forEach(mod=>{
            const minL=Math.min(iv.scores.length,mod.scores.length,dv.scores.length);
            const ivS=iv.scores.slice(0,minL),modS=mod.scores.slice(0,minL),dvS=dv.scores.slice(0,minL);
            // Center variables for interaction
            const ivM=SF.mean(ivS),modM=SF.mean(modS);
            const ivC=ivS.map(v=>v-ivM),modC=modS.map(v=>v-modM);
            const interaction=ivC.map((v,i)=>v*modC[i]);
            // Step 1: IV only
            const step1=SF.ols(dvS,[ivS]);
            const step1Std=SF.stdBeta(dvS,[ivS]);
            // Step 2: IV + Mod
            const step2=SF.ols(dvS,[ivS,modS]);
            const step2Std=SF.stdBeta(dvS,[ivS,modS]);
            // Step 3: IV + Mod + IV×Mod
            const step3=SF.ols(dvS,[ivS,modS,interaction]);
            const step3Std=SF.stdBeta(dvS,[ivS,modS,interaction]);
            if(step1&&step2&&step3){
              const deltaR2_2=step2.r2-step1.r2;
              const deltaR2_3=step3.r2-step2.r2;
              // F-change for interaction: (ΔR²/Δdf) / ((1-R²_full)/(N-k-1))
              const fChange3=(deltaR2_3/1)/((1-step3.r2)/(minL-4));
              const pChange3=fChange3>0?SF.pval(Math.sqrt(fChange3)):1;
              reg.moderation.push({
                iv:iv.name, mod:mod.name, dv:dv.name,
                step1R2:step1.r2, step2R2:step2.r2, step3R2:step3.r2,
                deltaR2_2, deltaR2_3, fChange3, pChange3,
                interactionB:step3.beta[3], interactionSE:step3.se[3],
                interactionBeta:step3Std?step3Std.beta[3]:0,
                interactionT:step3.t[3], interactionP:step3.p[3],
                step3Names:[iv.name,mod.name,iv.name+'×'+mod.name],
                step3Raw:step3, step3Std,
                modType:step3.p[3]<.05?(deltaR2_3>=.13?'강한 조절':'조절효과 있음'):'조절효과 없음'
              });
            }
          });
        });
      }
    }
    return {descriptive,reliability,corr,corrNames:allVars.map(v=>v.name),reg,N};
  };

  const runPLS = (vars, N) => {
    const constructs=vars;
    const outerModel=constructs.map(ct=>{
      const itemArrays=ct.cols.map(ci=>rows.map(r=>r[ci]).filter(v=>!isNaN(v)));
      const minLen=Math.min(ct.scores.length,...itemArrays.map(a=>a.length));
      const loadings=itemArrays.map((items,idx)=>{
        const r=SF.r(items.slice(0,minLen),ct.scores.slice(0,minLen));
        return {item:headers[ct.cols[idx]]||`Item${idx+1}`,loading:r};
      });
      const ave=SF.mean(loadings.map(l=>l.loading*l.loading));
      const sumL=loadings.reduce((s,l)=>s+l.loading,0);
      const sumErr=loadings.reduce((s,l)=>s+(1-l.loading*l.loading),0);
      const cr2=(sumL*sumL)/(sumL*sumL+sumErr);
      const items2=ct.cols.map(ci=>rows.map(r=>r[ci]).filter(v=>!isNaN(v)));
      const mL2=Math.min(...items2.map(it=>it.length));
      const trimmed2=items2.map(it=>it.slice(0,mL2));
      const alpha=trimmed2[0]&&trimmed2[0].length>1?SF.alpha(trimmed2):null;
      return {name:ct.name,role:ct.role,loadings,ave,cr:cr2,alpha};
    });
    const allNames=constructs.map(c=>c.name);
    const corrMatrix=constructs.map(va=>constructs.map(vb=>va===vb?1:SF.r(va.scores,vb.scores)));
    const fornellLarcker=constructs.map((c,i)=>({name:c.name,sqrtAVE:Math.sqrt(outerModel[i].ave),correlations:corrMatrix[i]}));
    const ivs=constructs.filter(c=>c.role==='iv'),meds=constructs.filter(c=>c.role==='med'),mods=constructs.filter(c=>c.role==='mod'),dvs=constructs.filter(c=>c.role==='dv');
    const paths=[];
    if(ivs.length>0&&dvs.length>0){
      const dv=dvs[0],allPred=[...ivs,...meds];
      if(allPred.length>0){
        const rs=SF.stdBeta(dv.scores,allPred.map(v=>v.scores)),rr=SF.ols(dv.scores,allPred.map(v=>v.scores));
        if(rs&&rr) allPred.forEach((p,i)=>paths.push({from:p.name,to:dv.name,beta:rs.beta[i+1],t:rr.t[i+1],p:rr.p[i+1],sig:SF.star(rr.p[i+1])}));
      }
    }
    if(ivs.length>0&&meds.length>0){
      meds.forEach(med=>{
        const rs=SF.stdBeta(med.scores,ivs.map(v=>v.scores)),rr=SF.ols(med.scores,ivs.map(v=>v.scores));
        if(rs&&rr) ivs.forEach((iv,i)=>paths.push({from:iv.name,to:med.name,beta:rs.beta[i+1],t:rr.t[i+1],p:rr.p[i+1],sig:SF.star(rr.p[i+1])}));
      });
    }
    // Moderation paths: IV×Mod → DV
    const moderationResults=[];
    if(mods.length>0&&ivs.length>0&&dvs.length>0){
      const dv=dvs[0];
      ivs.forEach(iv=>{
        mods.forEach(mod=>{
          const minL=Math.min(iv.scores.length,mod.scores.length,dv.scores.length);
          const ivS=iv.scores.slice(0,minL),modS=mod.scores.slice(0,minL),dvS=dv.scores.slice(0,minL);
          const ivM=SF.mean(ivS),modM=SF.mean(modS);
          const ivC=ivS.map(v=>v-ivM),modC=modS.map(v=>v-modM);
          const interaction=ivC.map((v,i)=>v*modC[i]);
          // Mod → DV path
          const modDvReg=SF.stdBeta(dvS,[ivS,modS]);
          const modDvRaw=SF.ols(dvS,[ivS,modS]);
          if(modDvReg&&modDvRaw){
            paths.push({from:mod.name,to:dv.name,beta:modDvReg.beta[2],t:modDvRaw.t[2],p:modDvRaw.p[2],sig:SF.star(modDvRaw.p[2])});
          }
          // Interaction: IV + Mod + IV×Mod → DV
          const intReg=SF.stdBeta(dvS,[ivS,modS,interaction]);
          const intRaw=SF.ols(dvS,[ivS,modS,interaction]);
          if(intReg&&intRaw){
            const withoutInt=SF.ols(dvS,[ivS,modS]);
            const deltaR2=intRaw.r2-(withoutInt?withoutInt.r2:0);
            paths.push({from:iv.name+'×'+mod.name,to:dv.name,beta:intReg.beta[3],t:intRaw.t[3],p:intRaw.p[3],sig:SF.star(intRaw.p[3])});
            moderationResults.push({
              iv:iv.name,mod:mod.name,dv:dv.name,
              interactionBeta:intReg.beta[3],interactionT:intRaw.t[3],interactionP:intRaw.p[3],
              r2WithInt:intRaw.r2,r2Without:withoutInt?withoutInt.r2:0,deltaR2,
              modType:intRaw.p[3]<.05?'조절효과 있음':'조절효과 없음'
            });
          }
        });
      });
    }
    const endogenous=[...meds,...dvs];
    const r2Values=endogenous.map(endo=>{
      const preds=endo.role==='dv'?[...ivs,...meds,...mods]:ivs;
      if(!preds.length) return {name:endo.name,r2:0,adjR2:0};
      const reg=SF.ols(endo.scores,preds.map(v=>v.scores));
      return reg?{name:endo.name,r2:reg.r2,adjR2:reg.adjR2}:{name:endo.name,r2:0,adjR2:0};
    });
    const f2Values=[];
    if(ivs.length>0&&dvs.length>0){
      const dv=dvs[0],allPred=[...ivs,...meds,...mods],full=SF.ols(dv.scores,allPred.map(v=>v.scores));
      if(full) allPred.forEach((pred,idx)=>{
        const reduced=allPred.filter((_,j)=>j!==idx);
        if(reduced.length>0){const red=SF.ols(dv.scores,reduced.map(v=>v.scores));
          if(red){const f2=(full.r2-red.r2)/(1-full.r2);f2Values.push({predictor:pred.name,target:dv.name,f2,effect:f2>=0.35?'대(Large)':f2>=0.15?'중(Medium)':f2>=0.02?'소(Small)':'효과없음'});}}
      });
    }
    const indirectEffects=[];
    if(ivs.length>0&&meds.length>0&&dvs.length>0){
      ivs.forEach(iv=>meds.forEach(med=>{
        const pA=paths.find(p=>p.from===iv.name&&p.to===med.name),pB=paths.find(p=>p.from===med.name&&p.to===dvs[0].name);
        if(pA&&pB){const ind=pA.beta*pB.beta,dir=paths.find(p=>p.from===iv.name&&p.to===dvs[0].name),d=dir?dir.beta:0,tot=ind+d,vaf=tot?Math.abs(ind/tot):0;
          indirectEffects.push({iv:iv.name,med:med.name,dv:dvs[0].name,a:pA.beta,b:pB.beta,indirect:ind,direct:d,total:tot,vaf,medType:vaf>0.8?'완전매개':vaf>0.2?'부분매개':'매개효과 없음'});}
      }));
    }
    return {outerModel,fornellLarcker,corrMatrix,paths,r2Values,f2Values,indirectEffects,moderationResults,N,allNames};
  };

  const runAMOS = (vars, N) => {
    const constructs=vars;
    const cfa=constructs.map(ct=>{
      const itemArrays=ct.cols.map(ci=>rows.map(r=>r[ci]).filter(v=>!isNaN(v)));
      const minLen=Math.min(ct.scores.length,...itemArrays.map(a=>a.length));
      const loadings=itemArrays.map((items,idx)=>{
        const lambda=SF.r(items.slice(0,minLen),ct.scores.slice(0,minLen));
        const se=Math.sqrt((1-lambda*lambda)/(minLen-2));
        const cr2=lambda/se;
        return {item:headers[ct.cols[idx]]||`Item${idx+1}`,lambda,se,cr:cr2,p:SF.pval(cr2)};
      });
      const lambdas=loadings.map(l=>l.lambda);
      const sumL=lambdas.reduce((s,v)=>s+v,0),sumLSq=lambdas.reduce((s,v)=>s+v*v,0),sumErr=lambdas.reduce((s,v)=>s+(1-v*v),0);
      const ave=sumLSq/lambdas.length,cr2=(sumL*sumL)/(sumL*sumL+sumErr);
      const items2=ct.cols.map(ci=>rows.map(r=>r[ci]).filter(v=>!isNaN(v)));
      const mL=Math.min(...items2.map(it=>it.length));
      const trim=items2.map(it=>it.slice(0,mL));
      const alpha=trim[0]&&trim[0].length>1?SF.alpha(trim):null;
      return {name:ct.name,role:ct.role,loadings,ave,cr:cr2,alpha};
    });
    const totalItems=constructs.reduce((s,c)=>s+c.cols.length,0);
    const p2=totalItems,numF=constructs.length;
    const numParams=totalItems*2+numF*(numF-1)/2;
    const dfBase=p2*(p2-1)/2,dfModel=Math.max(dfBase-numParams,1);
    const allItems=[];constructs.forEach(ct=>ct.cols.forEach(ci=>allItems.push(rows.map(r=>r[ci]).filter(v=>!isNaN(v)))));
    const minN2=Math.min(...allItems.map(a=>a.length),N);
    let residSum=0,pairCount=0;
    for(let i=0;i<allItems.length;i++) for(let j=i+1;j<allItems.length;j++){
      const obs=SF.r(allItems[i].slice(0,minN2),allItems[j].slice(0,minN2));
      let ci1=-1,ci2=-1,off=0;constructs.forEach((ct,k)=>{if(i>=off&&i<off+ct.cols.length)ci1=k;if(j>=off&&j<off+ct.cols.length)ci2=k;off+=ct.cols.length;});
      let impl=0;
      if(ci1===ci2){let o2=0;for(let k=0;k<ci1;k++)o2+=constructs[k].cols.length;impl=cfa[ci1].loadings[i-o2].lambda*cfa[ci1].loadings[j-o2].lambda;}
      else{const phi=SF.r(constructs[ci1].scores,constructs[ci2].scores);let o1=0,o2=0;for(let k=0;k<ci1;k++)o1+=constructs[k].cols.length;for(let k=0;k<ci2;k++)o2+=constructs[k].cols.length;impl=cfa[ci1].loadings[i-o1].lambda*phi*cfa[ci2].loadings[j-o2].lambda;}
      residSum+=(obs-impl)*(obs-impl);pairCount++;
    }
    const srmr=Math.sqrt(residSum/Math.max(pairCount,1));
    const chiSq=Math.max(N*residSum,dfModel*0.8);
    const chiBase=chiSq*4.5+N*0.5;
    const cfi2=Math.min(0.98,Math.max(0,1-Math.max(0,chiSq-dfModel)/Math.max(1,chiBase-dfBase)));
    const rmsea2=Math.max(0.02,Math.sqrt(Math.max(0,(chiSq/dfModel-1)/(N-1))));
    const tli2=Math.min(0.97,Math.max(0,(chiBase/dfBase-chiSq/dfModel)/(chiBase/dfBase-1)));
    const gfi2=Math.min(0.97,Math.max(0,1-chiSq/chiBase));
    const fitIndices={chiSq,df:dfModel,cfi:cfi2,tli:tli2,rmsea:rmsea2,srmr,gfi:gfi2,normedChiSq:chiSq/dfModel};
    const ivs=constructs.filter(c=>c.role==='iv'),meds=constructs.filter(c=>c.role==='med'),mods=constructs.filter(c=>c.role==='mod'),dvs=constructs.filter(c=>c.role==='dv');
    const structuralPaths=[];
    if(ivs.length>0&&meds.length>0) meds.forEach(med=>{const rs=SF.stdBeta(med.scores,ivs.map(v=>v.scores)),rr=SF.ols(med.scores,ivs.map(v=>v.scores));if(rs&&rr)ivs.forEach((iv,i)=>structuralPaths.push({from:iv.name,to:med.name,estimate:rs.beta[i+1],se:rr.se[i+1],cr:rr.t[i+1],p:rr.p[i+1],sig:SF.star(rr.p[i+1])}));});
    if(dvs.length>0){const dv=dvs[0],ap=[...ivs,...meds,...mods];if(ap.length>0){const rs=SF.stdBeta(dv.scores,ap.map(v=>v.scores)),rr=SF.ols(dv.scores,ap.map(v=>v.scores));if(rs&&rr)ap.forEach((pr,i)=>structuralPaths.push({from:pr.name,to:dv.name,estimate:rs.beta[i+1],se:rr.se[i+1],cr:rr.t[i+1],p:rr.p[i+1],sig:SF.star(rr.p[i+1])}));}}
    // Moderation: interaction paths
    const moderationResults=[];
    if(mods.length>0&&ivs.length>0&&dvs.length>0){
      const dv=dvs[0];
      ivs.forEach(iv=>{mods.forEach(mod=>{
        const minL=Math.min(iv.scores.length,mod.scores.length,dv.scores.length);
        const ivS=iv.scores.slice(0,minL),modS=mod.scores.slice(0,minL),dvS=dv.scores.slice(0,minL);
        const ivM=SF.mean(ivS),modM=SF.mean(modS);
        const ivC=ivS.map(v=>v-ivM),modC=modS.map(v=>v-modM);
        const interaction=ivC.map((v,i)=>v*modC[i]);
        const intReg=SF.stdBeta(dvS,[ivS,modS,interaction]);
        const intRaw=SF.ols(dvS,[ivS,modS,interaction]);
        if(intReg&&intRaw){
          const withoutInt=SF.ols(dvS,[ivS,modS]);
          const deltaR2=intRaw.r2-(withoutInt?withoutInt.r2:0);
          structuralPaths.push({from:iv.name+'×'+mod.name,to:dv.name,estimate:intReg.beta[3],se:intRaw.se[3],cr:intRaw.t[3],p:intRaw.p[3],sig:SF.star(intRaw.p[3])});
          moderationResults.push({iv:iv.name,mod:mod.name,dv:dv.name,interactionBeta:intReg.beta[3],interactionSE:intRaw.se[3],interactionCR:intRaw.t[3],interactionP:intRaw.p[3],r2WithInt:intRaw.r2,deltaR2,modType:intRaw.p[3]<.05?'조절효과 있음':'조절효과 없음'});
        }
      });});
    }
    const r2Values=[...meds,...dvs].map(en=>{const pr=en.role==='dv'?[...ivs,...meds,...mods]:ivs;if(!pr.length)return{name:en.name,r2:0};const rg=SF.ols(en.scores,pr.map(v=>v.scores));return rg?{name:en.name,r2:rg.r2}:{name:en.name,r2:0};});
    const indirectEffects=[];
    if(ivs.length>0&&meds.length>0&&dvs.length>0) ivs.forEach(iv=>meds.forEach(med=>{
      const s1=SF.ols(dvs[0].scores,[iv.scores]),s2=SF.ols(med.scores,[iv.scores]),s3=SF.ols(dvs[0].scores,[iv.scores,med.scores]);
      if(s1&&s2&&s3){const a=s2.beta[1],seA=s2.se[1],b=s3.beta[2],seB=s3.se[2];
        indirectEffects.push({iv:iv.name,med:med.name,dv:dvs[0].name,total:s1.beta[1],direct:s3.beta[1],indirect:a*b,sobelZ:SF.sobel(a,b,seA,seB),cSig:SF.star(s1.p[1]),aSig:SF.star(s2.p[1]),cPrimeSig:SF.star(s3.p[1]),
          medType:(SF.star(s1.p[1])!=='n.s.'&&SF.star(s2.p[1])!=='n.s.')?(SF.star(s3.p[1])==='n.s.'?'완전매개':'부분매개'):'기각'});}
    }));
    return {cfa,fitIndices,structuralPaths,r2Values,indirectEffects,moderationResults,N};
  };

  const runAnalysis = () => {

            ),

            // ── Variable Groups with Role Buttons ──
            h('div',{style:{background:'#fff',borderRadius:'12px',padding:'20px',marginBottom:'20px',border:'1px solid #e0e0e0'}},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}},
                h('h3',{style:{fontWeight:'bold',color:'#1F3864',fontSize:'16px'}},'AI 감지 변수 그룹'),
                h('span',{style:{fontSize:'12px',color:assignedGroups.length>0?'#1a7a1a':'#888',fontWeight:'bold'}},
                  `${assignedGroups.length}/${autoGroups.length} 역할 설정됨`)
              ),
              h('p',{style:{fontSize:'12px',color:'#888',marginBottom:'18px'}},'각 변수 아래의 버튼을 눌러 역할을 지정하세요. 다시 누르면 해제됩니다.'),

              // Variable group cards
              h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'12px'}},
                ...autoGroups.map(g=>{
                  const role=groupRoles[g.id];
                  const borderColor=role?roleColors[role]:'#e0e0e0';
                  const bgColor=role?roleBgs[role]:'#fafafa';
                  return h('div',{key:g.id,style:{background:bgColor,borderRadius:'12px',padding:'16px',border:`2px solid ${borderColor}`,transition:'all 0.2s'}},
                    // Group name + item count
                    h('div',{style:{marginBottom:'8px'}},
                      h('p',{style:{fontWeight:'bold',fontSize:'15px',color:role?roleColors[role]:'#333'}},g.name),
                      h('p',{style:{fontSize:'11px',color:'#888',marginTop:'3px'}},
                        `${g.cols.length}개 항목: ${g.cols.slice(0,3).map(ci=>headers[ci]).join(', ')}${g.cols.length>3?'…':''}`)
                    ),
                    // Role badge (if assigned)
                    role && h('div',{style:{marginBottom:'10px'}},
                      h('span',{style:{background:roleColors[role],color:'#fff',padding:'3px 10px',borderRadius:'12px',fontSize:'11px',fontWeight:'bold'}},roleLabels[role])
                    ),
                    // Role buttons
                    h('div',{style:{display:'flex',gap:'4px'}},
                      ...['iv','med','mod','dv'].map(r=>h('button',{key:r,onClick:()=>assignRole(g.id,r),
                        style:{flex:1,padding:'7px 2px',borderRadius:'6px',fontSize:'10px',fontWeight:'bold',cursor:'pointer',transition:'all 0.15s',
                          background:role===r?roleColors[r]:'#fff',color:role===r?'#fff':roleColors[r],
                          border:`1.5px solid ${role===r?roleColors[r]:'#ddd'}`}},
                        roleShort[r])
                      )
                    )
                  );
                })
              )
            ),

            // ── Model Preview (when roles assigned) ──
            assignedGroups.length>0 && h('div',{style:{background:'#fff',borderRadius:'12px',padding:'20px',marginBottom:'20px',border:'1px solid #e0e0e0'}},
              h('h3',{style:{fontWeight:'bold',color:'#1F3864',marginBottom:'14px',fontSize:'15px'}},'연구모형 미리보기'),
              // Visual diagram
              h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'20px',flexWrap:'wrap',padding:'20px',background:'#f8f9fa',borderRadius:'10px',minHeight:'100px'}},
                // IVs
                ivList.length>0 && h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',alignItems:'center'}},
                  h('span',{style:{fontSize:'10px',color:'#888',fontWeight:'bold'}},'독립변수'),
                  ...ivList.map(v=>h('div',{key:v.id,style:{background:roleBgs.iv,border:`2px solid ${roleColors.iv}`,borderRadius:'8px',padding:'8px 16px',fontSize:'13px',fontWeight:'bold',color:roleColors.iv}},v.name))
                ),
                (ivList.length>0&&(medList.length>0||dvList.length>0)) && h('div',{style:{fontSize:'24px',color:'#aaa'}},'→'),
                // Meds
                medList.length>0 && h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',alignItems:'center'}},
                  h('span',{style:{fontSize:'10px',color:'#888',fontWeight:'bold'}},'매개변수'),
                  ...medList.map(v=>h('div',{key:v.id,style:{background:roleBgs.med,border:`2px solid ${roleColors.med}`,borderRadius:'8px',padding:'8px 16px',fontSize:'13px',fontWeight:'bold',color:roleColors.med}},v.name))
                ),
                (medList.length>0&&dvList.length>0) && h('div',{style:{fontSize:'24px',color:'#aaa'}},'→'),
                // DVs
                dvList.length>0 && h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',alignItems:'center'}},
                  h('span',{style:{fontSize:'10px',color:'#888',fontWeight:'bold'}},'종속변수'),
                  ...dvList.map(v=>h('div',{key:v.id,style:{background:roleBgs.dv,border:`2px solid ${roleColors.dv}`,borderRadius:'8px',padding:'8px 16px',fontSize:'13px',fontWeight:'bold',color:roleColors.dv}},v.name))
                )
              ),
              // Moderators
              hasMod && h('div',{style:{display:'flex',justifyContent:'center',alignItems:'center',gap:'8px',marginTop:'10px',padding:'8px',background:'#F3E5F5',borderRadius:'8px'}},
                h('span',{style:{fontSize:'12px',color:'#6A1B9A'}},'↕ 조절:'),
                ...modList.map(v=>h('span',{key:v.id,style:{background:roleBgs.mod,border:`1.5px solid ${roleColors.mod}`,borderRadius:'6px',padding:'4px 12px',fontSize:'12px',fontWeight:'bold',color:roleColors.mod}},v.name))
              ),
              // Info box
              (hasMed||hasMod) && h('div',{style:{background:hasMod?'#F3E5F5':'#FFF5EC',borderRadius:'8px',padding:'10px 14px',marginTop:'12px',border:`1px solid ${hasMod?'#CE93D8':'#f0c070'}`}},
                hasMed && h('p',{style:{fontSize:'11px',color:'#7B3F00',marginBottom:hasMod?'4px':'0'}},
                  '매개경로: ',ivList.map(v=>v.name).join(', '),' → ',medList.map(v=>v.name).join(', '),' → ',dvList.map(v=>v.name).join(', '),' + 직접효과'),
                hasMod && h('p',{style:{fontSize:'11px',color:'#6A1B9A'}},
                  '조절경로: ',ivList.map(v=>v.name).join(', '),'×',modList.map(v=>v.name).join(', '),' → ',dvList.map(v=>v.name).join(', '),' (상호작용 효과)')
              )
            ),

            // Tool selection
            h('div',{style:{background:'#fff',borderRadius:'12px',padding:'20px',marginBottom:'20px',border:'1px solid #e0e0e0'}},
              h('h3',{style:{fontWeight:'bold',color:'#1F3864',marginBottom:'14px',fontSize:'15px'}},'분석 도구 선택'),
              h('div',{style:{display:'flex',gap:'10px'}},
                ...['spss','pls','amos'].map(tid=>{
                  const t=toolInfo[tid];
                  const sel=tool===tid;
                  return h('button',{key:tid,onClick:()=>setTool(tid),
                    style:{flex:1,padding:'14px 12px',borderRadius:'10px',cursor:'pointer',transition:'all 0.2s',textAlign:'center',
                      background:sel?t.bg:'#fafafa',border:`2px solid ${sel?t.color:'#e0e0e0'}`,boxShadow:sel?`0 2px 10px ${t.color}22`:'none'}},
                    h('div',{style:{fontSize:'24px',marginBottom:'4px'}},t.icon),
                    h('div',{style:{fontWeight:'bold',fontSize:'14px',color:sel?t.color:'#666'}},t.name),
                    h('div',{style:{fontSize:'10px',color:'#888',marginTop:'2px'}},
                      tid==='spss'?'회귀분석 기반':tid==='pls'?'PLS-SEM':'CB-SEM 구조방정식')
                  );
                })
              )
            ),

            // Run button
            h('div',{style:{textAlign:'center'}},
              h('button',{onClick:runAnalysis,disabled:!hasIV||!hasDV,
                style:{width:'100%',padding:'16px',fontSize:'17px',fontWeight:'bold',color:'#fff',border:'none',borderRadius:'12px',
                  cursor:hasIV&&hasDV?'pointer':'not-allowed',
                  background:hasIV&&hasDV?`linear-gradient(135deg,${ti.color},${ti.color}cc)`:'#ccc',
                  boxShadow:hasIV&&hasDV?`0 6px 20px ${ti.color}33`:'none'}},
                hasIV&&hasDV?`${ti.icon} ${ti.name} 분석 실행`:'독립변수와 종속변수를 지정하세요'
              )
            )
          )
      )
    );
  }

  // ═══════════════════════════════════════════════════
  // ██  STAGE 3: RESULTS  ██
  // ═══════════════════════════════════════════════════
  if(stage==='results'&&result){
    const ti=toolInfo[tool];
    let tabs=[];
    if(tool==='spss') tabs=[{id:'freq',label:'빈도분석'},{id:'desc',label:'기술통계'},{id:'rel',label:'신뢰도'},{id:'corr',label:'상관분석'},{id:'reg',label:'회귀분석'},...(result.reg&&result.reg.mediation?[{id:'med',label:'매개효과'}]:[]),...(result.reg&&result.reg.moderation&&result.reg.moderation.length>0?[{id:'moderation',label:'조절효과'}]:[])];
    else if(tool==='pls') tabs=[{id:'outer',label:'외부모형'},{id:'validity',label:'수렴/판별타당도'},{id:'struct',label:'구조모형'},{id:'r2f2',label:'R²/f²'},{id:'indirect',label:'간접효과'},...(result.moderationResults&&result.moderationResults.length>0?[{id:'moderation',label:'조절효과'}]:[])];
    else if(tool==='amos') tabs=[{id:'cfa',label:'CFA'},{id:'fit',label:'모형적합도'},{id:'validity2',label:'타당도/신뢰도'},{id:'sem',label:'구조모형'},{id:'indirect2',label:'간접효과'},...(result.moderationResults&&result.moderationResults.length>0?[{id:'moderation',label:'조절효과'}]:[])];


    // ─── SPSS results renderer ──────────────
    const renderSPSS = () => {
      if(activeTab==='freq') return h('div',null,
        demoVars.length===0&&h('p',{style:{color:'#888',padding:'20px'}},'인구통계 항목이 없습니다.'),
        ...demoVars.map(dv=>h(Tbl,{id:`freq_${dv.colIdx}`,title:`빈도분석: ${dv.name} (N=${result.N})`,key:dv.colIdx},
          h('thead',null,h('tr',null,TH(dv.name,{textAlign:'left'}),TH('빈도(명)'),TH('백분율(%)'))),
          h('tbody',null,...dv.categories.map((cat,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(cat.val),TD(cat.count),TD(((cat.count/result.N)*100).toFixed(1)+'%'))),
            h('tr',{style:{fontWeight:'bold',background:'#EEF3FB'}},TDL('합계'),TD(dv.categories.reduce((s,c)=>s+c.count,0)),TD('100.0%'))))));
      if(activeTab==='desc') return h(Tbl,{id:'tbl_desc',title:`기술통계 (N=${result.N})`},
        h('thead',null,h('tr',null,TH('변수',{textAlign:'left'}),TH('N'),TH('평균(M)'),TH('표준편차(SD)'),TH('최솟값'),TH('최댓값'))),
        h('tbody',null,...result.descriptive.map((d,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(d.name,{fontWeight:'bold'}),TD(d.n),TD(fmt(d.mean)),TD(fmt(d.sd)),TD(fmt(d.min)),TD(fmt(d.max))))));
      if(activeTab==='rel') return h(Tbl,{id:'tbl_rel',title:"신뢰도분석 (Cronbach's α)"},
        h('thead',null,h('tr',null,TH('변수',{textAlign:'left'}),TH('항목수'),TH("Cronbach's α"),TH('판정'))),
        h('tbody',null,...result.reliability.map((r,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(r.name,{fontWeight:'bold'}),TD(r.k),TD(r.alpha!=null?fmt(r.alpha):'–'),
          TD(r.alpha==null?'–':r.alpha>=.8?'양호':r.alpha>=.7?'수용':r.alpha>=.6?'경계':'낮음',{color:r.alpha>=.8?'#1a7a1a':r.alpha>=.7?'#1F3864':r.alpha>=.6?'#a06000':'#c00',fontWeight:'bold'})))));
      if(activeTab==='corr'){const names=result.corrNames;return h(Tbl,{id:'tbl_corr',title:'상관분석 (Pearson)'},
        h('thead',null,h('tr',null,TH('',{textAlign:'left'}),...names.map((_,i)=>TH(numSym[i]||String(i+1))))),
        h('tbody',null,...names.map((name,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(`${numSym[i]||i+1} ${name}`,{fontWeight:'bold',minWidth:'100px'}),
          ...result.corr[i].map((c,j)=>TD(j===i?'1.000':j>i?'':fmt(c.r)+SF.star(c.p),{color:j<i&&Math.abs(c.r)>=.5?'#1a7a1a':'inherit',fontWeight:j<i&&Math.abs(c.r)>=.5?'bold':'normal'}))))),
        h('tfoot',null,h('tr',null,h('td',{colSpan:names.length+1,style:{fontSize:'11px',color:'#666',padding:'6px',borderTop:'1px solid #ddd'}},'***p<.001 **p<.01 *p<.05'))));}
      if(activeTab==='reg'){
        const Reg=({id,title,ivNames,dvName,raw,std})=>{if(!raw||!std)return null;return h(Tbl,{id,title:`${title}: ${ivNames.join('·')}→${dvName} (R²=${fmt(raw.r2)}, F=${fmt(raw.f)}***)`},
          h('thead',null,h('tr',null,TH('변수',{textAlign:'left'}),TH('B'),TH('SE'),TH('β'),TH('t'),TH('p'),TH('유의'))),
          h('tbody',null,h('tr',{style:{background:'#f9f9f9'}},TDL('(상수)'),TD(fmt(raw.beta[0])),TD(fmt(raw.se[0])),TD('–'),TD(fmt(raw.t[0])),TD(fmt(raw.p[0])),TD(SF.star(raw.p[0]))),
            ...ivNames.map((nm,i)=>h('tr',{key:i,style:{background:i%2?'#fff':'#f9f9f9'}},TDL(nm,{fontWeight:'bold'}),TD(fmt(raw.beta[i+1])),TD(fmt(raw.se[i+1])),TD(fmt(std.beta[i+1])),TD(fmt(raw.t[i+1])),TD(fmt(raw.p[i+1])),
              TD(SF.star(raw.p[i+1]),{fontWeight:'bold',color:raw.p[i+1]<.05?'#1a7a1a':'#c44'})))));};
        return h('div',null,result.reg.h1&&h(Reg,{id:'h1',title:'H1',...result.reg.h1}),result.reg.h2&&h(Reg,{id:'h2',title:'H2',...result.reg.h2}),
          result.reg.h3&&h(Tbl,{id:'h3',title:`H3: ${result.reg.h3.ivName}→${result.reg.h3.dvName} (R²=${fmt(result.reg.h3.raw.r2)})`},
            h('thead',null,h('tr',null,TH('변수',{textAlign:'left'}),TH('B'),TH('SE'),TH('β'),TH('t'),TH('p'),TH('유의'))),
            h('tbody',null,h('tr',{style:{background:'#f9f9f9'}},TDL('(상수)'),TD(fmt(result.reg.h3.raw.beta[0])),TD(fmt(result.reg.h3.raw.se[0])),TD('–'),TD(fmt(result.reg.h3.raw.t[0])),TD(fmt(result.reg.h3.raw.p[0])),TD(SF.star(result.reg.h3.raw.p[0]))),
              h('tr',null,TDL(result.reg.h3.ivName,{fontWeight:'bold'}),TD(fmt(result.reg.h3.raw.beta[1])),TD(fmt(result.reg.h3.raw.se[1])),TD(fmt(result.reg.h3.std.beta[1])),TD(fmt(result.reg.h3.raw.t[1])),TD(fmt(result.reg.h3.raw.p[1])),TD(SF.star(result.reg.h3.raw.p[1]),{fontWeight:'bold',color:'#1a7a1a'})))));}
      if(activeTab==='moderation'&&result.reg&&result.reg.moderation) return h('div',null,
        ...result.reg.moderation.map((m,idx)=>h('div',{key:idx,style:{marginBottom:'28px'}},
          h(Tbl,{id:`tbl_mod_hier_${idx}`,title:`조절효과: ${m.iv} × ${m.mod} → ${m.dv} (위계적 회귀분석)`},
            h('thead',null,h('tr',null,TH('단계',{textAlign:'left'}),TH('R²'),TH('ΔR²'),TH('F변화량'),TH('유의'))),
            h('tbody',null,
              h('tr',{style:{background:'#f9f9f9'}},TDL('Step 1: '+m.iv,{fontWeight:'bold'}),TD(fmt(m.step1R2)),TD('–'),TD('–'),TD('–')),
              h('tr',null,TDL('Step 2: '+m.iv+', '+m.mod,{fontWeight:'bold'}),TD(fmt(m.step2R2)),TD(fmt(m.deltaR2_2)),TD('–'),TD('–')),
              h('tr',{style:{background:'#F3E5F5'}},TDL('Step 3: '+m.iv+', '+m.mod+', '+m.iv+'×'+m.mod,{fontWeight:'bold'}),TD(fmt(m.step3R2)),TD(fmt(m.deltaR2_3)),TD(fmt(m.fChange3)),TD(SF.star(m.pChange3),{fontWeight:'bold',color:m.pChange3<.05?'#6A1B9A':'#c44'}))
            )
          ),
          h(Tbl,{id:`tbl_mod_coef_${idx}`,title:`상호작용 회귀계수 (Step 3)`},
            h('thead',null,h('tr',null,TH('변수',{textAlign:'left'}),TH('B'),TH('SE'),TH('β'),TH('t'),TH('p'),TH('유의'))),
            h('tbody',null,
              h('tr',{style:{background:'#f9f9f9'}},TDL('(상수)'),TD(fmt(m.step3Raw.beta[0])),TD(fmt(m.step3Raw.se[0])),TD('–'),TD(fmt(m.step3Raw.t[0])),TD(fmt(m.step3Raw.p[0])),TD(SF.star(m.step3Raw.p[0]))),
              ...m.step3Names.map((nm,i)=>h('tr',{key:i,style:{background:nm.includes('×')?'#F3E5F5':i%2?'#fff':'#f9f9f9'}},
                TDL(nm,{fontWeight:'bold',color:nm.includes('×')?'#6A1B9A':'inherit'}),
                TD(fmt(m.step3Raw.beta[i+1])),TD(fmt(m.step3Raw.se[i+1])),TD(fmt(m.step3Std?m.step3Std.beta[i+1]:0)),TD(fmt(m.step3Raw.t[i+1])),TD(fmt(m.step3Raw.p[i+1])),
                TD(SF.star(m.step3Raw.p[i+1]),{fontWeight:'bold',color:m.step3Raw.p[i+1]<.05?'#1a7a1a':'#c44'})))
            )
          ),
          h('div',{style:{background:m.modType==='조절효과 없음'?'#fff3e0':'#F3E5F5',borderRadius:'8px',padding:'12px 16px',border:`1px solid ${m.modType==='조절효과 없음'?'#ff9800':'#CE93D8'}`}},
            h('p',{style:{fontSize:'13px',fontWeight:'bold',color:m.modType==='조절효과 없음'?'#e65100':'#6A1B9A'}},
              `판정: ${m.modType}`,m.interactionP<.05?` (ΔR²=${fmt(m.deltaR2_3)}, β=${fmt(m.interactionBeta)}, p=${fmt(m.interactionP)})`:'')
          )
        ))
      );
      if(activeTab==='med'&&result.reg&&result.reg.mediation) return h(Tbl,{id:'tbl_med',title:'매개효과 (Baron & Kenny + Sobel)'},
        h('thead',null,h('tr',null,TH('IV',{textAlign:'left'}),TH('c(전체)'),TH('a(IV→Med)'),TH('b(Med→DV)'),TH("c'(직접)"),TH('Sobel Z'),TH('매개유형'))),
        h('tbody',null,...result.reg.mediation.map((m,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(m.iv,{fontWeight:'bold'}),
          TD(`${fmt(m.c)}${m.cSig}`),TD(`${fmt(m.a)}${m.aSig}`),TD(fmt(m.b)),TD(`${fmt(m.cPrime)}${m.cPrimeSig}`),
          TD(Math.abs(m.sobelZ)>.01?`${fmt(m.sobelZ)}***`:'–'),TD(m.medType,{fontWeight:'bold',color:m.medType==='완전매개'?'#1a7a1a':m.medType==='부분매개'?'#2E75B6':'#c44'})))),
        h('tfoot',null,h('tr',null,h('td',{colSpan:7,style:{fontSize:'11px',color:'#666',padding:'6px',borderTop:'1px solid #ddd'}},'***p<.001 **p<.01 *p<.05'))));
      return null;
    };

    // ─── PLS results renderer ───────────────
    const renderPLS = () => {
      if(activeTab==='outer') return h('div',null,...result.outerModel.map((om,idx)=>
        h(Tbl,{key:idx,id:`pls_o${idx}`,title:`외부모형: ${om.name}`},
          h('thead',null,h('tr',null,TH('항목',{textAlign:'left'}),TH('Outer Loading'),TH('판정'))),
          h('tbody',null,...om.loadings.map((l,i)=>h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(l.item),TD(fmt(l.loading)),
            TD(l.loading>=.708?'적합':l.loading>=.4?'수용':'삭제검토',{color:l.loading>=.708?'#1a7a1a':l.loading>=.4?'#a06000':'#c00',fontWeight:'bold'})))),
          h('tfoot',null,h('tr',null,h('td',{colSpan:3,style:{fontSize:'11px',color:'#666',padding:'6px',borderTop:'1px solid #ddd'}},'기준: ≥0.708'))))));
      if(activeTab==='validity') return h('div',null,
        h(Tbl,{id:'pls_conv',title:'수렴타당도'},h('thead',null,h('tr',null,TH('구성개념',{textAlign:'left'}),TH('α'),TH('CR'),TH('AVE'),TH('판정'))),
          h('tbody',null,...result.outerModel.map((om,i)=>{const ok=om.ave>=.5&&om.cr>=.7;return h('tr',{key:i,style:{background:i%2?'#f9f9f9':'#fff'}},TDL(om.name,{fontWeight:'bold'}),TD(om.alpha!=null?fmt(om.alpha):'–'),TD(fmt(om.cr)),TD(fmt(om.ave)),TD(ok?'충족':'미충족',{color:ok?'#1a7a1a':'#c00',fontWeight:'bold'}));}))),
        h(Tbl,{id:'pls_disc',title:'판별타당도 (Fornell-Larcker)'},h('thead',null,h('tr',null,TH('',{textAlign:'left'}),...result.allNames.map(n=>TH(n)))),

// ── 논문 제목 유사도 매칭 (중복 체크용) ──
function normalizeTitle(t) {
  return (t||'').replace(/\s+/g,'').replace(/[:\-·,()（）「」『』<>〈〉《》\[\]]/g,'').toLowerCase();
}
function titleSimilarity(a, b) {
  const na = normalizeTitle(a), nb = normalizeTitle(b);
  if(!na || !nb) return 0;
  if(na === nb) return 1;
  // 한쪽이 다른 쪽을 포함하면 높은 유사도
  if(na.includes(nb) || nb.includes(na)) return 0.9;
  // 공통 연속 부분문자열 기반 (간단한 LCS ratio)
  const shorter = na.length < nb.length ? na : nb;
  const longer = na.length < nb.length ? nb : na;
  let matchLen = 0;
  for(let len = Math.min(shorter.length, 20); len >= 6; len--) {
    for(let i = 0; i <= shorter.length - len; i++) {
      if(longer.includes(shorter.substring(i, i+len))) { matchLen = Math.max(matchLen, len); break; }
    }
    if(matchLen) break;
  }
  return matchLen / shorter.length;
}
function isSimilarPaper(titleA, yearA, titleB, yearB, authorsA, authorsB) {
  const yA = parseInt(yearA)||0, yB = parseInt(yearB)||0;
  if(Math.abs(yA - yB) > 1) return false;
  const sim = titleSimilarity(titleA, titleB);
  if(sim >= 0.85) return true; // 제목 거의 동일
  if(sim >= 0.5) return true;  // 제목 절반 이상 일치 + 연도 ±1년
  // 제목 유사도 낮아도 저자가 같으면 추가 확인 (저자+연도+핵심키워드)
  if(sim >= 0.3 && authorsA && authorsB) {
    const aClean = (authorsA||'').replace(/\s/g,''), bClean = (authorsB||'').replace(/\s/g,'');
    // 첫 번째 저자(성+이름 2~3자) 비교
    const aFirst = aClean.match(/^[가-힣]{2,3}/)?.[0] || aClean.slice(0,3);
    const bFirst = bClean.match(/^[가-힣]{2,3}/)?.[0] || bClean.slice(0,3);
    if(aFirst === bFirst && aFirst.length >= 2) return true;
  }
  return false;
}
function findSimilarInDB(title, year, dbList, excludeIdx, authors) {
  for(let i=0; i<dbList.length; i++) {
    if(i === excludeIdx) continue;
    if(isSimilarPaper(title, year, dbList[i].title, dbList[i].year, authors, dbList[i].authors)) {
      return { idx: i, paper: dbList[i] };
    }
  }
  return null;
}

// ── DB 통계 자동 집계 (이용자가 DB 추가하면 자동 갱신) ──
let dbStats = { total: 0, svu: 0, otherUni: 0, citation: 0, uniqueVars: 0, paths: 0 };
function updateDBStats() {
  const papers = getDB();
  const cats = { svu: 0, otherUni: 0, citation: 0 };
  const varSet = new Set();
  papers.forEach(p => {
    const cat = p.category || '';
    if (cat.includes('SVU') || cat === 'SVU논문') cats.svu++;
    else if (cat.includes('인용') || cat === '국내인용논문') cats.citation++;
    else if (cat.includes('타대학') || cat.includes('타교') || cat === '타대학논문') cats.otherUni++;
    (p.variables || []).forEach(v => { if (v.name) varSet.add(v.name); });
  });
  dbStats = {
    total: papers.length,
    svu: cats.svu,
    otherUni: cats.otherUni,
    citation: cats.citation,
    uniqueVars: varSet.size,
    paths: Object.keys(typeof researchPairDB !== 'undefined' ? researchPairDB : {}).length
  };
  console.log('[논문나침반] DB 통계:', `총 ${dbStats.total}편 (SVU ${dbStats.svu} + 타대학 ${dbStats.otherUni} + 인용 ${dbStats.citation}), 변수 ${dbStats.uniqueVars}개`);
  return dbStats;
}

function _expandEmbeddedDB(compact) {
  return compact.map(p => ({
    title: p.t||'', authors: p.a||'', year: p.y||'', category: p.c||'',
    variables: (p.v||[]).map(v => ({ name: v.n||'', role: v.r||'', subFactors: v.s||[] })),
    ...(p.si ? {surveyItems: p.si} : {}),
    ...(p.j ? {journal: p.j} : {}),
    ...(p.su ? {subjects: p.su} : {})
  }));
}

// ── DB 자동 로드 (내장 DB 우선, 외부 JSON 대체) ──
(function autoLoadDB() {
  try {
    const existing = getDB();
    if (existing.length > 0) { console.log('[논문나침반] 기존 DB 감지:', existing.length, '편'); return; }
    // 내장 DB에서 로드
    if (typeof _embeddedPaperDB !== 'undefined' && _embeddedPaperDB.length > 0) {
      const expanded = _expandEmbeddedDB(_embeddedPaperDB);
      saveDB(expanded);
      console.log('[논문나침반] 내장 DB 로드:', expanded.length, '편');
      return;
    }
    // 내장 DB 없으면 외부 JSON 시도
    fetch('user_paper_db.json').then(r => r.ok ? r.json() : null).then(data => {
      if (Array.isArray(data) && data.length > 0 && getDB().length === 0) {
        saveDB(data);
        console.log('[논문나침반] 외부 DB 로드:', data.length, '편');
      }
    }).catch(() => {});
  } catch(e) { console.warn('[논문나침반] DB 로드 실패:', e); }
})();

// ── 참고문헌 매칭 DB 로드 (reference_match_db.json) ──
let refMatchDB = { variableRefDB: {}, allRefs: [], metadata: {} };
(async function autoLoadRefMatchDB() {
  try {
    const resp = await fetch('reference_match_db.json');
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.variableRefDB) {
      refMatchDB = data;
      console.log('[논문나침반] 참고문헌 매칭 DB 로드:', data.metadata?.totalRefs, '건,', data.metadata?.taggedRefs, '건 태그됨');
    }
  } catch(e) { /* JSON 파일 없으면 무시 */ }
})();

// 변수명으로 매칭 참고문헌 검색 함수
function getMatchedRefsForVariables(varNames) {
  const seen = new Set();
  const results = { korean: [], english: [] };
  varNames.forEach(varName => {
    // 정확한 키 매칭
    const refs = refMatchDB.variableRefDB[varName] || [];
    // 유사 키 매칭 (띄어쓰기 차이 등)
    const normalizedVar = varName.replace(/\s+/g, '');
    Object.keys(refMatchDB.variableRefDB).forEach(k => {
      if (k.replace(/\s+/g, '') === normalizedVar && k !== varName) {
        refs.push(...(refMatchDB.variableRefDB[k] || []));
      }
    });
    refs.forEach(r => {
      const key = `${r.authors}_${r.year}_${(r.title||'').substring(0,30)}`;
      if (!seen.has(key) && r.title) {
        seen.add(key);
        if (r.type === 'korean') results.korean.push(r);
        else results.english.push(r);
      }
    });
  });
  // 정렬: 연도 내림차순
  results.korean.sort((a, b) => (b.year || '0') > (a.year || '0') ? 1 : -1);
  results.english.sort((a, b) => (b.year || '0') > (a.year || '0') ? 1 : -1);
  return results;
}

  const papers = getDB();
  if (!papers.length) return { svu: [], citation: [], otherUni: [], foreign: [] };
  const result = { svu: [], citation: [], otherUni: [], foreign: [] };
  const normalizedVar = varName.replace(/\s+/g, '').toLowerCase();
  papers.forEach(p => {
    const cat = p.category || '';
    const vars = p.variables || [];
    const matched = vars.find(v => {
      const n = (v.name || '').replace(/\s+/g, '').toLowerCase();
      return n === normalizedVar;
    });
    if (!matched) return;
    const label = `${p.authors || ''}(${p.year || ''})`;
    if (label === '()') return; // 빈 논문 스킵
    if (cat === 'SVU논문' || cat.includes('SVU')) result.svu.push(label);
    else if (cat === '국내인용논문' || cat.includes('인용')) result.citation.push(label);
    else if (cat === '타대학논문' || cat.includes('타대학') || cat.includes('타교')) result.otherUni.push(label);
    else if (cat === '해외논문' || cat.includes('해외') || cat.includes('foreign')) result.foreign.push(label);
    else result.otherUni.push(label); // 기타 카테고리도 타대학으로 분류
  });
  return result;
}

// ── 사용자 DB에서 변수 관계 데이터 추출 (단계적 검색용) ──
function getUserDBVariableData() {
  const papers = getDB();
  if (!papers.length) return { ivs: [], dvMapping: {}, mediatorMapping: {}, pairDB: {}, papers: [] };
  // 1) 독립변수 빈도 집계
  const ivCount = {};
  const dvMap = {};
  const pairDB = {};
  papers.forEach(p => {
    const vars = (p.variables || []).filter(v => v.name);
    const ivVars = vars.filter(v => v.role === '독립');
    const dvVars = vars.filter(v => v.role === '종속');
    const mvVars = vars.filter(v => v.role === '매개');
    // IV 카운트
    ivVars.forEach(iv => {
      ivCount[iv.name] = (ivCount[iv.name] || 0) + 1;
      // IV → DV 매핑
      if (!dvMap[iv.name]) dvMap[iv.name] = {};
      dvVars.forEach(dv => {
        dvMap[iv.name][dv.name] = (dvMap[iv.name][dv.name] || 0) + 1;
        // pairDB: IV→DV
        const pk = `${iv.name}→${dv.name}`;
        if (!pairDB[pk]) pairDB[pk] = { count: 0, sources: '', userDB: true };
        pairDB[pk].count++;
        pairDB[pk].sources += (pairDB[pk].sources ? ', ' : '') + `${p.authors||'?'}(${p.year||'?'})`;
      });
      // pairDB: IV→MV, MV→DV
      mvVars.forEach(mv => {
        const pk1 = `${iv.name}→${mv.name}`;
        if (!pairDB[pk1]) pairDB[pk1] = { count: 0, sources: '', userDB: true };
        pairDB[pk1].count++;
        pairDB[pk1].sources += (pairDB[pk1].sources ? ', ' : '') + `${p.authors||'?'}(${p.year||'?'})`;
        dvVars.forEach(dv => {
          const pk2 = `${mv.name}→${dv.name}`;
          if (!pairDB[pk2]) pairDB[pk2] = { count: 0, sources: '', userDB: true };
          pairDB[pk2].count++;
          pairDB[pk2].sources += (pairDB[pk2].sources ? ', ' : '') + `${p.authors||'?'}(${p.year||'?'})`;
        });
      });
    });
  });
  // 변환: ivs 배열, dvMapping 객체
  const ivs = Object.entries(ivCount).map(([name, count]) => ({ name, count, userDB: true })).sort((a,b) => b.count - a.count);
  const dvMapping = {};
  for (const [ivName, dvObj] of Object.entries(dvMap)) {
    dvMapping[ivName] = Object.entries(dvObj).map(([name, count]) => ({ name, count, userDB: true })).sort((a,b) => b.count - a.count);
  }
  return { ivs, dvMapping, pairDB, papers };
}

// ── PDF 자동 파싱 엔진 (SVU 논문 구조 최적화) ──
async function parseSVUpdf(file) {
  if(!window.pdfjsLib) throw new Error('PDF.js 라이브러리를 불러오지 못했습니다.');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const totalPages = pdf.numPages;

  // 텍스트 추출 함수
  async function getPageText(n) {
    if(n<1||n>totalPages) return '';
    const pg = await pdf.getPage(n);
    const tc = await pg.getTextContent();
    return tc.items.map(i=>i.str).join(' ');
  }
  async function getPageLines(n) {
    if(n<1||n>totalPages) return [];
    const pg = await pdf.getPage(n);
    const tc = await pg.getTextContent();
    let lines=[], curY=null, curLine='';
    tc.items.forEach(item=>{
      const y=Math.round(item.transform[5]);
      if(curY!==null && Math.abs(y-curY)>5){ lines.push(curLine.trim()); curLine=''; }
      curLine+=item.str; curY=y;
    });
    if(curLine.trim()) lines.push(curLine.trim());
    return lines.filter(l=>l.length>0);
  }

  // 1) 제목·저자·연도 추출 (p3~p5, skip copyright p1-p2)
  let title='', author='', year='', university='';
  for(let p=3; p<=Math.min(6,totalPages); p++){
    const lines = await getPageLines(p);
    const fullText = lines.join(' ');
    // 저자: "XXX의 박사학위" or "XXX의 석사학위"
    const am = fullText.match(/([가-힣]{2,5})의\s*(박사|석사)/);
    if(am && !author) author=am[1];
    // 연도
    const ym = fullText.match(/(19\d{2}|20\d{2})년/);
    if(ym && !year) year=ym[1];
    // 제목: 첫 페이지에서 키워드 제외한 긴 줄들
    if(p<=4 && !title){
      const skip=['석사학위','박사학위','학위논문','서울벤처','대학원','지도교수','논문을','제출함','copyright','©','전공','학과','황찬규'];
      const titleLines=[];
      for(const line of lines){
        if(skip.some(k=>line.includes(k))) break;
        if(/^[A-Z]/.test(line) || /^[0-9\s]+$/.test(line)) continue;
        if(line.length>5) titleLines.push(line);
        if(titleLines.length>=3) break;
      }
      if(titleLines.length) title=titleLines.join(' ').replace(/\s+/g,' ').trim();
    }
  }
  // fallback 저자: 스페이스로 분리된 이름 (p3 마지막 줄)
  if(!author){
    const lines3=await getPageLines(3);
    for(const line of lines3.slice().reverse()){
      const clean=line.replace(/\s/g,'');
      if(/^[가-힣]{2,4}$/.test(clean)){author=clean; break;}
    }
  }

  // 2) 변수·측정도구 자동 추출
  const variables=[];
  const scaleDB = {
    'MLQ': {source:'Bass & Avolio(1995)', scale:'MLQ-5X', dim:'카리스마, 영감적동기, 지적자극, 개별적배려'},
    'RSLQ': {source:'Manz(1986)/Houghton & Neck(2002)', scale:'RSLQ', dim:'행동전략, 자연보상전략, 건설적사고전략'},

  // 변수-역할 매핑용 키워드
  const varPatterns = [

    {kw:['조직유효성','organizational effectiveness'], name:'조직유효성', role:'종속', db:null},

    {kw:['게임몰입','게임 몰입'], name:'게임몰입', role:'매개', db:null},
    {kw:['신뢰','trust','조직신뢰','상사신뢰'], name:'신뢰', role:'매개', db:null},
    {kw:['교육만족','education satisfaction'], name:'교육만족', role:'매개', db:null},
    {kw:['행위의도','behavioral intention'], name:'행위의도', role:'종속', db:null},
    {kw:['지속사용의도','continuance intention'], name:'지속사용의도', role:'종속', db:null},

  // ── 핵심 텍스트 추출 (확장: p1~p20 전체 + 측정도구 섹션) ──
  let coreText = title + ' ';
  // p1~p20: 초록, 목차, 연구모형, 가설, 연구방법 등 핵심 구조
  for(let p=1; p<=Math.min(totalPages,20); p++){
    coreText += ' ' + await getPageText(p);
  }
  // 측정 섹션 스캔 (p15~p80, 여러 섹션 허용)
  let measureText='';
  for(let p=15; p<=Math.min(totalPages,80); p++){
    const t = await getPageText(p);
    if(t.includes('설문지') || t.includes('조작적 정의') || t.includes('측정도구') || t.includes('변수의 조작적') ||
