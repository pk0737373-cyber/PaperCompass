      measureText += ' ' + t;
      for(let pp=p+1; pp<=Math.min(p+5,totalPages); pp++){
        measureText += ' ' + await getPageText(pp);
      }
      break;
    }
  }
  // 가설 섹션 별도 스캔 (연구모형/가설 설정)
  let hypothesisText='';
  for(let p=8; p<=Math.min(totalPages,50); p++){
    const t = await getPageText(p);
    if(t.includes('연구모형') || t.includes('연구 모형') || t.includes('가설 설정') || t.includes('연구가설') ||
       t.includes('연구의 가설') || t.includes('가설설정') || t.includes('연구모델')){
      hypothesisText += ' ' + t;
      for(let pp=p+1; pp<=Math.min(p+3,totalPages); pp++){
        hypothesisText += ' ' + await getPageText(pp);
      }
      break;
    }
  }
  const scanText = coreText + ' ' + measureText + ' ' + hypothesisText;

  // ── researchPairDB에서 동적 변수 패턴 생성 ──
  const dynamicVarNames = new Set();
  if(typeof researchPairDB !== 'undefined'){
    Object.keys(researchPairDB).forEach(key => {
      const arrow = key.indexOf('→');
      if(arrow < 0) return;
      dynamicVarNames.add(key.substring(0, arrow));
      dynamicVarNames.add(key.substring(arrow + 1));
    });
  }
  // varPatterns 목록에 없는 동적 변수도 추가
  const staticNames = new Set(varPatterns.map(vp => vp.name));
  dynamicVarNames.forEach(name => {
    if(!staticNames.has(name) && !staticNames.has(name.replace(/ /g,''))){
      // 공백 있는 버전과 없는 버전 모두 키워드로
      const kws = [name];
      if(name.includes(' ')) kws.push(name.replace(/ /g,''));
      else if(name.length > 4) kws.push(name.slice(0,2) + ' ' + name.slice(2)); // "학습만족" → "학습 만족"
      varPatterns.push({kw: kws, name, role:'auto', db:null});
    }
  });

  // ── 본문에서 변수 역할(IV/매개/DV/조절) 추론 ──
  const roleContext = {};
  // 패턴 1: "독립변수는 X", "독립변수: X", "독립변수로 X"
  const rolePatterns = [
    {re:/독립변수[는로:을를의]\s*([가-힣A-Za-z/ ]{2,15})/g, role:'독립'},
    {re:/종속변수[는로:을를의]\s*([가-힣A-Za-z/ ]{2,15})/g, role:'종속'},
    {re:/매개변수[는로:을를의]\s*([가-힣A-Za-z/ ]{2,15})/g, role:'매개'},
    {re:/조절변수[는로:을를의]\s*([가-힣A-Za-z/ ]{2,15})/g, role:'조절'},
    // 패턴 2: "X을 독립변수로", "X를 매개변수로"
    {re:/([가-힣A-Za-z/ ]{2,15})[을를이가]\s*독립변수/g, role:'독립'},
    {re:/([가-힣A-Za-z/ ]{2,15})[을를이가]\s*종속변수/g, role:'종속'},
    {re:/([가-힣A-Za-z/ ]{2,15})[을를이가]\s*매개변수/g, role:'매개'},
    {re:/([가-힣A-Za-z/ ]{2,15})[을를이가]\s*조절변수/g, role:'조절'},
    // 패턴 3: "X → Y 미치는 영향" → X=독립, Y=종속
    {re:/([가-힣A-Za-z/ ]{2,15})[이가]\s+([가-힣A-Za-z/ ]{2,15})[에]\s*미치는\s*영향/g, role:'_path'},
    // 패턴 4: "X과 Y의 관계에서 Z의 매개효과"
    {re:/([가-힣A-Za-z/ ]{2,15})[과와]\s*([가-힣A-Za-z/ ]{2,15})\s*(?:의?\s*관계|간)[에서]*\s*([가-힣A-Za-z/ ]{2,15})의?\s*매개/g, role:'_med_path'},
    {re:/([가-힣A-Za-z/ ]{2,15})[과와]\s*([가-힣A-Za-z/ ]{2,15})\s*(?:의?\s*관계|간)[에서]*\s*([가-힣A-Za-z/ ]{2,15})의?\s*조절/g, role:'_mod_path'},
  ];
  rolePatterns.forEach(({re, role}) => {
    let m;
    while((m = re.exec(scanText)) !== null){
      if(role === '_path'){
        // X→Y: X=독립, Y=종속
        const iv = m[1].trim().replace(/[은는이가을를의에과와]/g,'');
        const dv = m[2].trim().replace(/[은는이가을를의에과와]/g,'');
        if(iv.length >= 2) roleContext[iv] = '독립';
        if(dv.length >= 2) roleContext[dv] = '종속';
      } else if(role === '_med_path'){
        const iv = m[1].trim().replace(/[은는이가을를의에과와]/g,'');
        const dv = m[2].trim().replace(/[은는이가을를의에과와]/g,'');
        const mv = m[3].trim().replace(/[은는이가을를의에과와]/g,'');
        if(iv.length >= 2) roleContext[iv] = '독립';
        if(dv.length >= 2) roleContext[dv] = '종속';
        if(mv.length >= 2) roleContext[mv] = '매개';
      } else if(role === '_mod_path'){
        const iv = m[1].trim().replace(/[은는이가을를의에과와]/g,'');
        const dv = m[2].trim().replace(/[은는이가을를의에과와]/g,'');
        const mod = m[3].trim().replace(/[은는이가을를의에과와]/g,'');
        if(iv.length >= 2) roleContext[iv] = '독립';
        if(dv.length >= 2) roleContext[dv] = '종속';
        if(mod.length >= 2) roleContext[mod] = '조절';
      } else {
        const varName = m[1].trim().replace(/[은는이가을를의에과와,]/g,'');
        if(varName.length >= 2) roleContext[varName] = role;
      }
    }
  });
  // 제목에서도 역할 추론: "X이(가) Y에 미치는 영향"
  const titlePath = title.match(/([가-힣A-Za-z/ ]+)[이가]\s*([가-힣A-Za-z/ ]+)[에]\s*미치는/);
  if(titlePath){
    const ivT = titlePath[1].trim().replace(/^.*[의에서]\s*/, '');
    const dvT = titlePath[2].trim();
    if(ivT.length >= 2) roleContext[ivT] = '독립';
    if(dvT.length >= 2) roleContext[dvT] = '종속';
  }
  // 제목에서 매개/조절 추출: "Z의 매개효과" "W의 조절효과"
  const titleMed = title.match(/([가-힣A-Za-z/ ]+)의?\s*매개\s*효과/);
  if(titleMed){ const mv = titleMed[1].trim().replace(/^.*[과와에서]\s*/,''); if(mv.length>=2) roleContext[mv]='매개'; }
  const titleMod = title.match(/([가-힣A-Za-z/ ]+)의?\s*조절\s*효과/);
  if(titleMod){ const mod = titleMod[1].trim().replace(/^.*[과와에서]\s*/,''); if(mod.length>=2) roleContext[mod]='조절'; }

  // ── 변수 탐지 (확장된 패턴 + 역할 추론) ──
  const found = new Set();
  for(const vp of varPatterns){
    if(vp.kw.some(k => scanText.includes(k))){
      if(found.has(vp.name)) continue;
      found.add(vp.name);
      const info = vp.db && scaleDB[vp.db] ? scaleDB[vp.db] : {};
      // 역할: 본문 맥락 → varPatterns 기본값 순으로 결정
      let role = vp.role;
      // roleContext에서 매칭 시도 (공백 제거 비교)
      const nameNoSpace = vp.name.replace(/ /g,'');
      for(const [ctxName, ctxRole] of Object.entries(roleContext)){
        const ctxNoSpace = ctxName.replace(/ /g,'');
        if(ctxNoSpace === nameNoSpace || nameNoSpace.includes(ctxNoSpace) || ctxNoSpace.includes(nameNoSpace)){
          role = ctxRole;
          break;
        }
      }
      if(role === 'auto') role = '독립'; // 동적 추가 변수는 기본 독립
      // 문항수 추출
      let itemCount='';
      const nameClean = vp.name.replace(/[() ]/g,'');
      const itemMatch = measureText.match(new RegExp(nameClean.slice(0,4)+'[^]*?(\\d+)\\s*문항'));
      if(itemMatch) itemCount = itemMatch[1];
      variables.push({
        name: vp.name, role,
        dimensions: info.dim||'', itemCount,
        scale: '5점 Likert', source: info.source||'',
        koreanSource: '', alpha: ''
      });
    }
  }
  // 변수가 없으면 기본 빈 항목
  if(!variables.length) variables.push({name:'',role:'독립',dimensions:'',itemCount:'',scale:'5점 Likert',source:'',koreanSource:'',alpha:''});

  // 표본크기 추출
  let sampleSize='';
  const sampleMatch = scanText.match(/(\d{2,4})\s*부[를을의가]?\s*(배포|발송|수거|회수|배부)/);
  if(sampleMatch) sampleSize = sampleMatch[1]+'부';
  else {
    const sampleMatch2 = scanText.match(/유효\s*(\d{2,4})\s*부/);
    if(sampleMatch2) sampleSize = sampleMatch2[1]+'부 (유효)';
  }

  // 3) 자동 분류 (SVU / 타대학 / 해외 / 국내인용)
  let category = '기타';
  const allText = fullText + ' ' + measureText;
  // 대학명 추출 (본문에서)
  const uniMatch = allText.match(/([가-힣]{2,10}대학원대학교|[가-힣]{2,10}대학교)/);
  if(uniMatch && !university) university = uniMatch[1];
  // SVU 판별: 반드시 본문 텍스트에 '서울벤처' 키워드가 있어야 함
  if(allText.includes('서울벤처대학원') || allText.includes('서울벤처')){
    category = 'SVU논문';
    if(!university) university = '서울벤처대학원대학교';
  } else if(/[A-Za-z]{20,}/.test(title) && !author) {
    category = '해외논문';
  } else if(university){
    category = '타대학논문';
  } else if(allText.includes('대학교') || allText.includes('대학원')){
    category = '타대학논문';
  }
  // 국내 인용 논문 (학술지, KCI 등) — 학위논문이 아닌 경우만
  if(allText.includes('KCI') || allText.includes('학술지') || allText.includes('저널') || allText.includes('Journal')){
    if(!allText.includes('학위논문') && !allText.includes('석사학위') && !allText.includes('박사학위'))
      category = '국내인용논문';
  }

  // 지도교수 자동 감지
  let advisor = '';
  if(category === 'SVU논문') advisor = '황찬규';
  else {
    const advMatch = allText.match(/지도교수\s*:?\s*([가-힣]{2,4})/);
    if(advMatch) advisor = advMatch[1];
  }

  // ── 4) 선행연구 표 자동 추출 (이론적 배경 섹션) ──
  const priorStudies = [];
  try {
    // 이론적 배경은 보통 p10~p60 범위
    const tablePages = [];
    for(let p=8; p<=Math.min(totalPages, 65); p++){
      const t = await getPageText(p);
      // "표 II-N" 또는 "표 2-N" 패턴 + "간의 연구" 또는 "매개효과" 키워드
      if((/표\s*[ⅡII2][\s\-]*\d+/.test(t) || /[<〈]표/.test(t)) &&
         (/간의?\s*(선행)?\s*연구/.test(t) || /매개효과\s*연구/.test(t) || /조절효과\s*연구/.test(t))) {
        tablePages.push(p);
      }
    }
    for(const startPage of tablePages){
      // 테이블 제목에서 변수명 추출
      const lines = await getPageLines(startPage);
      let fromVar='', toVar='', mediator='', tableTitle='';
      for(const line of lines){
        // "표 II-N> X과(와) Y 간의 연구" 또는 "X과(와) Y 간 Z의 매개효과 연구"
        const titleMatch = line.match(/표[\s\dⅡII\-]+[>〉]?\s*([가-힣A-Za-z/]+)[과와]\(?\s*([가-힣A-Za-z/]+)\)?\s*간/);
        if(titleMatch){
          fromVar = titleMatch[1].replace(/^[<〈]\s*/, '').trim();
          toVar = titleMatch[2].trim();
          const medMatch = line.match(/간\s*([가-힣A-Za-z/]+)의?\s*(매개|조절)/);
          if(medMatch) mediator = medMatch[1].trim();
          tableTitle = line.trim();
          break;
        }
      }
      if(!fromVar || !toVar) continue;

      // 테이블이 있는 페이지 + 다음 2페이지에서 연구자 추출
      const entries = [];
      const seenAuthors = new Set();
      for(let pp=startPage; pp<=Math.min(startPage+2, totalPages); pp++){
        const pg = await pdf.getPage(pp);
        const tc = await pg.getTextContent();
        // x/y 좌표 기반으로 행(row) 재구성
        const rawItems = tc.items.map(it => ({
          text: it.str.trim(),
          x: Math.round(it.transform[4]),
          y: Math.round(it.transform[5]),
          w: it.width || 0
        })).filter(it => it.text.length > 0);
        // y좌표 그루핑 (5px 허용)
        const yGroups = {};
        rawItems.forEach(it => {
          const yKey = Math.round(it.y / 6) * 6;
          if(!yGroups[yKey]) yGroups[yKey] = [];
          yGroups[yKey].push(it);
        });
        // y 내림차순 (PDF는 아래→위 좌표)
        const sortedYKeys = Object.keys(yGroups).map(Number).sort((a,b) => b-a);
        let headerYIdx = -1;
        // 헤더 행 찾기 (연구자 + 독립변수 키워드 포함)
        for(let yi=0; yi<sortedYKeys.length; yi++){
          const rowText = yGroups[sortedYKeys[yi]].sort((a,b)=>a.x-b.x).map(it=>it.text).join(' ');
          if(rowText.includes('연구자') && (rowText.includes('독립변수') || rowText.includes('종속변수') || rowText.includes('대상'))){
            headerYIdx = yi;
            break;
          }
        }
        // 헤더 행이 이 페이지에 없으면 (이전 페이지에서 시작된 테이블의 연속)
        // 첫 페이지가 아니면 모든 행을 데이터로 처리
        const dataStartIdx = headerYIdx >= 0 ? headerYIdx + 1 : (pp > startPage ? 0 : -1);
        if(dataStartIdx < 0) continue;
        // 헤더 행의 x좌표로 컬럼 경계 추정
        let colBounds = [];
        if(headerYIdx >= 0){
          const headerItems = yGroups[sortedYKeys[headerYIdx]].sort((a,b)=>a.x-b.x);
          colBounds = headerItems.map(it => it.x);
        }
        // 데이터 행 처리
        for(let yi=dataStartIdx; yi<sortedYKeys.length; yi++){
          const rowItems = yGroups[sortedYKeys[yi]].sort((a,b)=>a.x-b.x);
          const rowText = rowItems.map(it=>it.text).join(' ');
          // "출처:" 만나면 중단
          if(rowText.includes('출처:') || rowText.includes('출처 :')) break;
          // 다음 표 제목 만나면 중단
          if(/표\s*[ⅡII2][\s\-]*\d+/.test(rowText) && rowText.includes('간')) break;
          // 연구자명 패턴 추출
          // 국내: 김학선(2019), 임종인(2023), 송정수·양필석(2008)
          const korMatches = [...rowText.matchAll(/([가-힣]{2,10}(?:[·,\s]+[가-힣]{2,5})?)\s*\(\s*(\d{4})\s*\)/g)];
          // 국외: Bass(1985), Carmeli et al.(2006), Stajkovic&Luthans(1998)
          const engMatches = [...rowText.matchAll(/([A-Z][a-zA-Z&\s\.]+?)\s*\(\s*(\d{4})\s*\)/g)];
          const allMatches = [...korMatches, ...engMatches];
          for(const m of allMatches){
            const authorName = m[1].trim().replace(/\s+/g,' ');
            const authorYear = m[2];
            const authorKey = `${authorName}(${authorYear})`;
            // 중복 및 표 제목 자체의 저자 필터링
            if(seenAuthors.has(authorKey)) continue;
            // 척도 원전 저자 필터 (Bass, Bandura 등은 표 내용이 아닐 수 있음)
            // → 필터 안 함: 선행연구표에 원전 저자도 포함될 수 있음
            seenAuthors.add(authorKey);
            // 컬럼 기반 필드 추출 시도
            let subject='', iv='', mv='', dv='', result='';
            if(colBounds.length >= 4){
              // 컬럼 경계로 각 셀 추출
              const assignToCol = (items, bounds) => {
                const cols = bounds.map(() => '');
                items.forEach(it => {
                  let bestCol = 0, minDist = 9999;
                  bounds.forEach((bx, ci) => {
                    const dist = Math.abs(it.x - bx);
                    if(dist < minDist){ minDist = dist; bestCol = ci; }
                  });
                  cols[bestCol] += (cols[bestCol] ? ' ' : '') + it.text;
                });
                return cols;
              };
              const cols = assignToCol(rowItems, colBounds);
              // 일반적 컬럼 순서: [구분, 연구자, 대상, 독립변수, 매개변수, 종속변수, 연구결과]
              // 또는 [연구자, 대상, 독립변수, 매개변수, 종속변수, 연구결과]
              if(cols.length >= 6){
                const offset = cols.length >= 7 ? 1 : 0; // 구분 컬럼 유무
                subject = cols[offset+1] || '';
                iv = cols[offset+2] || fromVar;
                mv = cols[offset+3] || (mediator || '-');
                dv = cols[offset+4] || toVar;
                result = cols[offset+5] || '';
              }
            }
            entries.push({
              researcher: authorKey,
              region: /[가-힣]/.test(authorName) ? '국내' : '국외',
              subject: subject || '-',
              iv: iv || fromVar,
              mv: mv || (mediator || '-'),
              dv: dv || toVar,
              result: result || `${fromVar} → ${toVar} 관계 연구`,
            });
          }
        }
      }
      if(entries.length > 0){
        priorStudies.push({ tableTitle, fromVar, toVar, mediator, entries });
      }
    }
  } catch(e) { console.warn('[선행연구표 추출 오류]', e); }

  return {
    title: title.slice(0,120),
    authors: author ? (advisor ? author+', '+advisor : author) : '',
    year, university,
    sampleSize,
    method: '설문조사',
    analysisMethod: scanText.includes('구조방정식')||scanText.includes('SEM') ? 'SEM(구조방정식)' :
                    scanText.includes('위계적') ? '위계적 회귀분석' :
                    scanText.includes('회귀분석') ? '다중회귀분석' : '',
    variables,
    totalPages,
    category,
    priorStudies,  // 선행연구 표에서 추출된 데이터
  };
}

// ── 사용자_논문DB.xlsx 내보내기 ──
function exportUserDBtoExcel(papers) {
  if(!window.XLSX) { alert('SheetJS 라이브러리가 필요합니다.'); return; }
  const wb = XLSX.utils.book_new();
  const categories = ['SVU논문','타대학논문','해외논문','국내인용논문'];
  const catColors = {'SVU논문':'#1F3864','타대학논문':'#7B3F00','해외논문':'#1a6b3a','국내인용논문':'#6B3FA0'};

  categories.forEach(cat => {
    const catPapers = papers.filter(p => (p.category||'기타') === cat);
    // 논문목록 데이터
    const rows = [['No','저자','연도','논문제목','소속대학','표본','분석방법','변수요약','등록일']];
    catPapers.forEach((p,i) => {
      const varSummary = (p.variables||[]).filter(v=>v.name).map(v=>`[${v.role}]${v.name}`).join(', ');
      rows.push([i+1, p.authors, p.year, p.title, p.university, p.sampleSize, p.analysisMethod, varSummary, p.addedAt||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    // 열 너비
    ws['!cols'] = [{wch:5},{wch:20},{wch:6},{wch:60},{wch:20},{wch:10},{wch:15},{wch:40},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, cat);
  });

  // 측정도구 시트 (전체)
  const toolRows = [['논문No','변수명','역할','원전출처','척도명','하위요인','문항수','척도','논문제목']];
  papers.forEach((p,pi) => {
    (p.variables||[]).filter(v=>v.name).forEach(v => {
      toolRows.push([pi+1, v.name, v.role, v.source, v.scale||'', v.dimensions, v.itemCount, v.scale, p.title]);
    });
  });
  const wsTools = XLSX.utils.aoa_to_sheet(toolRows);
  wsTools['!cols'] = [{wch:8},{wch:18},{wch:6},{wch:30},{wch:20},{wch:35},{wch:8},{wch:12},{wch:50}];
  XLSX.utils.book_append_sheet(wb, wsTools, '측정도구_전체');

  // 미분류 시트
  const uncatPapers = papers.filter(p => !categories.includes(p.category||''));
  if(uncatPapers.length){
    const uncatRows = [['No','저자','연도','논문제목','소속대학','메모']];
    uncatPapers.forEach((p,i) => uncatRows.push([i+1, p.authors, p.year, p.title, p.university, p.memo||'']));
    const wsUncat = XLSX.utils.aoa_to_sheet(uncatRows);
    wsUncat['!cols'] = [{wch:5},{wch:20},{wch:6},{wch:60},{wch:20},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsUncat, '미분류');
  }

  XLSX.writeFile(wb, `사용자_논문DB_${new Date().toISOString().slice(0,10)}.xlsx`);
}

    let updated;

    if(editIdx !== null) {
      updated = [...papers]; updated[editIdx] = cleanForm;
      showToast('✅ 논문 정보가 수정되었습니다.');
    } else {
      updated = [...papers, cleanForm];
      showToast('✅ 새 논문이 DB에 추가되었습니다!');
    }
    saveDB(updated); setPapers(updated);
    setForm(emptyPaper()); setEditIdx(null); setView('list');
  };

  const handleDelete = (idx) => {
    if(!confirm(`"${papers[idx].title}" 논문을 삭제하시겠습니까?`)) return;
    const updated = papers.filter((_,i) => i !== idx);
    saveDB(updated); setPapers(updated);
    showToast('🗑️ 삭제되었습니다.');
    if(view === 'detail') setView('list');
  };

  const handleEdit = (idx) => { setForm({...papers[idx]}); setEditIdx(idx); setView('add'); };

  const addVariable = () => setForm({...form, variables: [...form.variables, {name:'',role:'독립',dimensions:'',itemCount:'',scale:'5점 Likert',source:'',koreanSource:'',alpha:''}]});
  const removeVariable = (i) => setForm({...form, variables: form.variables.filter((_,j)=>j!==i)});
  const updateVariable = (i, field, val) => { const v=[...form.variables]; v[i]={...v[i],[field]:val}; setForm({...form, variables:v}); };

  const addSurveyItem = () => setForm({...form, surveyItems: [...form.surveyItems, {variable:'',dimension:'',itemNo:form.surveyItems.length+1,text:'',source:''}]});
  const removeSurveyItem = (i) => setForm({...form, surveyItems: form.surveyItems.filter((_,j)=>j!==i)});
  const updateSurveyItem = (i, field, val) => { const s=[...form.surveyItems]; s[i]={...s[i],[field]:val}; setForm({...form, surveyItems:s}); };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(papers, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `논문DB_${new Date().toISOString().slice(0,10)}.json`; a.click();
    showToast('📥 JSON 파일로 내보내기 완료!');
  };

  // ── PDF 업로드 자동입력 ──
  const handlePdfUpload = async (goToAdd=true) => {
    const input = document.createElement('input'); input.type='file'; input.accept='.pdf';
    input.onchange = async (e) => {
      const file = e.target.files[0]; if(!file) return;
      setPdfLoading(true);
      try {
        const result = await parseSVUpdf(file);
        const newForm = {
          ...emptyPaper(),
          title: result.title,
          authors: result.authors,
          year: result.year,
          university: result.university,
          sampleSize: result.sampleSize,
          method: result.method,
          analysisMethod: result.analysisMethod,
          category: result.category || 'SVU논문',
          variables: result.variables,
          memo: `PDF 자동 추출 (${result.totalPages}페이지) — ${file.name}`,
        };
        setForm(newForm); setEditIdx(null);
        if(goToAdd) setView('add');
        setPdfLoading(false);
        showToast(`✅ PDF에서 자동 추출 완료! (${result.variables.length}개 변수 감지)`);
      } catch(err) {
        setPdfLoading(false);
        showToast('❌ PDF 파싱 오류: '+err.message, 'error');
      }
    };
    input.click();
  };

  // ── 다중 PDF 일괄 업로드 (미리보기 방식) ──
  const processBulkPdfs = async (files) => {
    if(!files.length) return;
    setBulkProgress({current:0, total:files.length, parsing:true});
    setBulkParsed([]);
    setView('bulkPreview');
    const results = [];
    for(let i=0; i<files.length; i++){
      setBulkProgress({current:i+1, total:files.length, parsing:true});
      const file = files[i];
      try {
        const result = await parseSVUpdf(file);
        if(!result.title) { results.push({_fileName:file.name, _status:'error', _error:'제목 추출 실패', _checked:false, title:'', authors:'', year:'', category:'기타', variables:[]}); continue; }
        const dupMatch = findSimilarInDB(result.title, result.year, papers, -1, result.authors);
        const isDup = dupMatch !== null;
        results.push({
          ...emptyPaper(),
          title: result.title, authors: result.authors, year: result.year,
          university: result.university, sampleSize: result.sampleSize,
          method: result.method, analysisMethod: result.analysisMethod,
          category: result.category || 'SVU논문',
          advisor: result.advisor || '',
          variables: result.variables,
          priorStudies: result.priorStudies || [],
          memo: `PDF 자동추출 — ${file.name}`,
          addedAt: new Date().toISOString().slice(0,10),
          _fileName: file.name,
          _status: isDup ? 'dup' : 'ok',
          _dupInfo: dupMatch ? `${dupMatch.paper.authors||''}(${dupMatch.paper.year||''}) "${(dupMatch.paper.title||'').slice(0,30)}..."` : '',
          _checked: !isDup, // 중복이면 체크 해제
          _varCount: result.variables.filter(v=>v.name).length,
          _pages: result.totalPages,
        });
      } catch(err) {
        results.push({_fileName:file.name, _status:'error', _error:err.message, _checked:false, title:'(파싱 실패)', authors:'', year:'', category:'기타', variables:[]});
      }
    }
    setBulkParsed(results);
    setBulkProgress({current:files.length, total:files.length, parsing:false});
  };

  const handleBulkPdfUpload = () => {
    const input = document.createElement('input'); input.type='file'; input.accept='.pdf'; input.multiple=true;
    input.onchange = (e) => processBulkPdfs(Array.from(e.target.files));
    input.click();
  };

  // 드래그앤드롭 핸들러
  const handleDrop = (e) => { e.preventDefault(); setDragOver(false); const files = Array.from(e.dataTransfer.files).filter(f=>f.type==='application/pdf'); if(files.length) processBulkPdfs(files); };
  const handleDragOver = (e) => { e.preventDefault(); setDragOver(true); };
  const handleDragLeave = () => setDragOver(false);

  // 미리보기에서 개별 항목 수정
  const updateBulkItem = (idx, field, val) => { const u=[...bulkParsed]; u[idx]={...u[idx],[field]:val}; setBulkParsed(u); };
  const toggleBulkCheck = (idx) => { const u=[...bulkParsed]; u[idx]._checked=!u[idx]._checked; setBulkParsed(u); };
  const toggleBulkAll = (checked) => { setBulkParsed(bulkParsed.map(p=>({...p, _checked: p._status!=='error' ? checked : false}))); };

  // 미리보기 변수 수정
  const updateBulkVar = (pIdx, vIdx, field, val) => {
    const u=[...bulkParsed]; const vars=[...u[pIdx].variables]; vars[vIdx]={...vars[vIdx],[field]:val}; u[pIdx]={...u[pIdx],variables:vars}; setBulkParsed(u);
  };
  const addBulkVar = (pIdx) => {
    const u=[...bulkParsed]; u[pIdx]={...u[pIdx],variables:[...u[pIdx].variables,{name:'',role:'독립',dimensions:'',itemCount:'',scale:'5점 Likert',source:'',koreanSource:'',alpha:''}]}; setBulkParsed(u);
  };
  const removeBulkVar = (pIdx, vIdx) => {
    const u=[...bulkParsed]; u[pIdx]={...u[pIdx],variables:u[pIdx].variables.filter((_,i)=>i!==vIdx)}; setBulkParsed(u);
  };

  // 확인 후 일괄 저장
  const saveBulkParsed = () => {
    const toSave = bulkParsed.filter(p=>p._checked && p._status!=='error');
    if(!toSave.length){ showToast('저장할 논문이 없습니다.','error'); return; }
    const current = [...papers];
    let added=0;
    toSave.forEach(p => {
      const clean = {...p};
      delete clean._fileName; delete clean._status; delete clean._checked; delete clean._varCount; delete clean._pages; delete clean._error;
      clean.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      // 최종 중복 체크
      if(!findSimilarInDB(clean.title, clean.year, current, -1, clean.authors)){
        current.push(clean); added++;
      }
    });
    saveDB(current); setPapers(current);
    showToast(`✅ ${added}편이 DB에 저장되었습니다!`);
    setBulkParsed([]); setView('list');
  };

  const importJSON = () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if(!Array.isArray(imported)) { showToast('올바른 JSON 형식이 아닙니다.', 'error'); return; }
          let added = 0, skipped = 0;
          const current = [...papers];
          imported.forEach(p => {
            if(findSimilarInDB(p.title, p.year, current, -1, p.authors)) { skipped++; }
            else { current.push({...emptyPaper(), ...p, id: Date.now().toString(36)+Math.random().toString(36).slice(2,6)}); added++; }
          });
          saveDB(current); setPapers(current);
          showToast(`📂 가져오기 완료! 추가 ${added}편, 중복 ${skipped}편`);
        } catch { showToast('JSON 파싱 오류', 'error'); }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const filtered = papers.filter(p => {
    const matchSearch = !searchTerm || p.title.includes(searchTerm) || p.authors.includes(searchTerm) ||
      (p.variables||[]).some(v => v.name.includes(searchTerm));
    const matchCat = catFilter === '전체' || (p.category||'기타') === catFilter;
    return matchSearch && matchCat;
  });

  const catCounts = {
    '전체': papers.length,
    'SVU논문': papers.filter(p=>(p.category||'기타')==='SVU논문').length,
    '타대학논문': papers.filter(p=>(p.category||'기타')==='타대학논문').length,
    '해외논문': papers.filter(p=>(p.category||'기타')==='해외논문').length,
    '국내인용논문': papers.filter(p=>(p.category||'기타')==='국내인용논문').length,
    '기타': papers.filter(p=>!p.category || !['SVU논문','타대학논문','해외논문','국내인용논문'].includes(p.category)).length,
  };
  const stats = {
    total: papers.length,
    vars: [...new Set(papers.flatMap(p => (p.variables||[]).map(v => v.name)).filter(Boolean))].length,
    items: papers.reduce((s,p) => s + (p.surveyItems||[]).filter(i=>i.text).length, 0),
  };
  const catColors = {'전체':'#1F3864','SVU논문':'#1F3864','타대학논문':'#7B3F00','해외논문':'#1a6b3a','국내인용논문':'#6B3FA0','기타':'#888'};
  const catBg = {'전체':'#EEF3FB','SVU논문':'#EEF3FB','타대학논문':'#FFF5EC','해외논문':'#EDF7EF','국내인용논문':'#F3EEF8','기타':'#f5f5f5'};

  const inputStyle = {width:'100%',padding:'9px 12px',borderRadius:'8px',border:'1px solid #d0d0d0',fontSize:'13px',fontFamily:'Arial',outline:'none',boxSizing:'border-box'};
  const labelStyle = {fontSize:'12px',fontWeight:'bold',color:'#1F3864',marginBottom:'4px',display:'block'};
  const sectionStyle = {background:'#fff',borderRadius:'12px',padding:'20px',marginBottom:'16px',border:'1px solid #e8e8e8'};
  const btnPrimary = {background:'#1F3864',color:'#fff',border:'none',borderRadius:'8px',padding:'10px 20px',fontSize:'13px',fontWeight:'bold',cursor:'pointer'};
  const btnSecondary = {background:'#f0f0f0',color:'#555',border:'1px solid #ddd',borderRadius:'8px',padding:'8px 16px',fontSize:'12px',cursor:'pointer'};
  const btnDanger = {background:'#fff',color:'#C0392B',border:'1px solid #C0392B',borderRadius:'8px',padding:'6px 12px',fontSize:'11px',cursor:'pointer'};

  // ── TOAST ──
  const toastEl = toast ? h('div',{style:{position:'fixed',top:'20px',left:'50%',transform:'translateX(-50%)',
    background:toast.type==='error'?'#C0392B':'#27AE60',color:'#fff',padding:'12px 28px',borderRadius:'10px',
    fontSize:'14px',fontWeight:'bold',zIndex:9999,boxShadow:'0 4px 20px rgba(0,0,0,0.2)',animation:'fadeIn 0.3s'}},toast.msg) : null;

  // ── BULK PREVIEW VIEW (PDF 일괄 업로드 미리보기) ──
  if(view === 'bulkPreview') {
    const checkedCount = bulkParsed.filter(p=>p._checked).length;
    const okCount = bulkParsed.filter(p=>p._status==='ok').length;
    const dupCount = bulkParsed.filter(p=>p._status==='dup').length;
    const errCount = bulkParsed.filter(p=>p._status==='error').length;
    return h('div',{style:{minHeight:'100vh',background:'linear-gradient(160deg,#FFF8F0 0%,#ffffff 60%)',padding:'20px'}},
      toastEl,
      h('div',{style:{maxWidth:'1100px',margin:'0 auto'}},
        // 헤더
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}},
          h('div',null,
            h('h1',{style:{fontSize:'26px',fontWeight:'bold',color:'#1F3864',marginBottom:'4px'}},'📄 PDF 일괄 분석 결과'),
            h('p',{style:{fontSize:'13px',color:'#888'}},
              bulkProgress.parsing
                ? `분석 중... ${bulkProgress.current}/${bulkProgress.total}편`
                : `총 ${bulkParsed.length}편 분석 완료 — 확인 후 저장하세요`)
          ),
          h('div',{style:{display:'flex',gap:'10px'}},
            h('button',{onClick:()=>{setBulkParsed([]);setView('list');},
              style:{background:'#f0f0f0',color:'#555',border:'1px solid #ddd',borderRadius:'8px',padding:'10px 20px',fontSize:'13px',cursor:'pointer'}},'← 취소'),
            !bulkProgress.parsing && h('button',{onClick:saveBulkParsed,disabled:!checkedCount,
              style:{background:checkedCount?'#27AE60':'#ccc',color:'#fff',border:'none',borderRadius:'8px',padding:'10px 24px',fontSize:'14px',fontWeight:'bold',cursor:checkedCount?'pointer':'not-allowed',boxShadow:checkedCount?'0 2px 10px rgba(39,174,96,0.3)':'none'}},
              `✅ 선택한 ${checkedCount}편 DB에 저장`)
          )
        ),
        // 진행 바
        bulkProgress.parsing && h('div',{style:{background:'#e0e0e0',borderRadius:'8px',height:'8px',marginBottom:'16px',overflow:'hidden'}},
          h('div',{style:{width:`${(bulkProgress.current/bulkProgress.total*100)}%`,height:'100%',background:'linear-gradient(90deg,#C0392B,#E74C3C)',borderRadius:'8px',transition:'width 0.3s'}})
        ),
        // 요약 카드
        !bulkProgress.parsing && h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px',marginBottom:'16px'}},
          ...[
            ['📄 분석 완료',bulkParsed.length+'편','#1F3864','#EEF3FB'],
            ['✅ 추가 가능',okCount+'편','#27AE60','#EDF7EF'],
            ['⚠️ 중복',dupCount+'편','#E67E22','#FFF5EC'],
            ['❌ 실패',errCount+'편','#C0392B','#FFF0F0']
          ].map(([label,val,color,bg])=>
            h('div',{key:label,style:{background:bg,borderRadius:'10px',padding:'12px',textAlign:'center',border:`1px solid ${color}22`}},
              h('div',{style:{fontSize:'11px',color:'#888'}},label),
              h('div',{style:{fontSize:'20px',fontWeight:'bold',color}},val))
          )
        ),
        // 전체 선택/해제
        !bulkProgress.parsing && h('div',{style:{display:'flex',gap:'12px',alignItems:'center',marginBottom:'12px'}},
          h('label',{style:{fontSize:'13px',color:'#555',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px'}},
            h('input',{type:'checkbox',checked:checkedCount===bulkParsed.filter(p=>p._status!=='error').length,
              onChange:e=>toggleBulkAll(e.target.checked)}),
            '전체 선택/해제'),
          h('span',{style:{fontSize:'12px',color:'#888'}},`(${checkedCount}편 선택됨)`)
        ),
        // 논문 카드 리스트
        h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
          bulkParsed.map((p, idx) => {
            const isExpanded = expandedIdx === idx;
            const statusIcon = p._status==='ok' ? '✅' : p._status==='dup' ? '⚠️' : '❌';
            const statusColor = p._status==='ok' ? '#27AE60' : p._status==='dup' ? '#E67E22' : '#C0392B';
            const statusLabel = p._status==='ok' ? '추가 가능' : p._status==='dup' ? ('중복: ' + (p._dupInfo||'기존 DB에 유사 논문 존재')) : '파싱 실패';
            return h('div',{key:idx,style:{background:'#fff',borderRadius:'12px',border:`2px solid ${p._checked?statusColor:'#e0e0e0'}`,overflow:'hidden',transition:'all 0.2s'}},
              // 요약 행 (클릭으로 펼침)
              h('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'14px 16px',cursor:'pointer',background:p._checked?`${statusColor}08`:'#fafafa'},
                onClick:()=>setExpandedIdx(isExpanded?null:idx)},
                h('input',{type:'checkbox',checked:!!p._checked,disabled:p._status==='error',
                  onChange:(e)=>{e.stopPropagation();toggleBulkCheck(idx);},
                  style:{width:'18px',height:'18px',cursor:'pointer'}}),
                h('span',{style:{fontSize:'16px'}},statusIcon),
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{style:{fontSize:'14px',fontWeight:'bold',color:'#1F3864',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
                    p.title || '(제목 없음)'),
                  h('div',{style:{fontSize:'12px',color:'#888',marginTop:'2px'}},
                    [p.authors, p.year, p.category, p.variables?.filter(v=>v.name).length+'개 변수'].filter(Boolean).join(' · '))
                ),
                h('span',{style:{fontSize:'11px',padding:'3px 10px',borderRadius:'12px',background:`${statusColor}15`,color:statusColor,fontWeight:'bold',whiteSpace:'nowrap'}},statusLabel),
                h('span',{style:{fontSize:'16px',color:'#999',transform:isExpanded?'rotate(180deg)':'rotate(0)',transition:'transform 0.2s'}},'▼')
              ),
              // 펼침 상세 (수정 가능)
              isExpanded && h('div',{style:{padding:'16px',borderTop:'1px solid #eee',background:'#FAFBFF'}},
                // 기본 정보 수정
                h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px',marginBottom:'14px'}},
                  ...[['제목','title'],['저자','authors'],['연도','year'],['대학','university'],['카테고리','category'],['표본크기','sampleSize']].map(([label,field])=>
                    h('div',{key:field},
                      h('label',{style:{fontSize:'11px',fontWeight:'bold',color:'#1F3864',display:'block',marginBottom:'3px'}},label),
                      field==='category'
                        ? h('select',{value:p[field]||'',onChange:e=>updateBulkItem(idx,field,e.target.value),
                            style:{width:'100%',padding:'7px 10px',borderRadius:'6px',border:'1px solid #d0d0d0',fontSize:'12px'}},
                            ...['SVU논문','타대학논문','해외논문','국내인용논문','기타'].map(opt=>h('option',{key:opt,value:opt},opt)))
                        : h('input',{value:p[field]||'',onChange:e=>updateBulkItem(idx,field,e.target.value),
                            style:{width:'100%',padding:'7px 10px',borderRadius:'6px',border:'1px solid #d0d0d0',fontSize:'12px',boxSizing:'border-box'}})
                    )
                  )
                ),
                // 변수 수정
                h('div',{style:{marginBottom:'10px'}},
                  h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},
                    h('span',{style:{fontSize:'12px',fontWeight:'bold',color:'#6B3FA0'}},'📊 변수 ('+p.variables.filter(v=>v.name).length+'개)'),
                    h('button',{onClick:()=>addBulkVar(idx),style:{fontSize:'11px',color:'#27AE60',background:'#EDF7EF',border:'1px solid #27AE60',borderRadius:'6px',padding:'3px 10px',cursor:'pointer'}},'+변수 추가')
                  ),
                  p.variables.map((v,vi) =>
                    h('div',{key:vi,style:{display:'flex',gap:'6px',marginBottom:'6px',alignItems:'center'}},
                      h('input',{value:v.name||'',placeholder:'변수명',onChange:e=>updateBulkVar(idx,vi,'name',e.target.value),
                        style:{flex:2,padding:'6px 8px',borderRadius:'6px',border:'1px solid #d0d0d0',fontSize:'12px'}}),
                      h('select',{value:v.role||'독립',onChange:e=>updateBulkVar(idx,vi,'role',e.target.value),
                        style:{flex:1,padding:'6px',borderRadius:'6px',border:'1px solid #d0d0d0',fontSize:'12px'}},
                        ...['독립','매개','종속','조절'].map(r=>h('option',{key:r,value:r},r))),
                      h('input',{value:v.dimensions||'',placeholder:'하위차원',onChange:e=>updateBulkVar(idx,vi,'dimensions',e.target.value),
                        style:{flex:2,padding:'6px 8px',borderRadius:'6px',border:'1px solid #d0d0d0',fontSize:'12px'}}),
                      h('button',{onClick:()=>removeBulkVar(idx,vi),style:{color:'#C0392B',background:'none',border:'none',fontSize:'16px',cursor:'pointer',padding:'2px 6px'}},'✕')
                    )
                  )
                ),
                // 파일 정보
                h('div',{style:{fontSize:'11px',color:'#aaa',marginTop:'8px'}},
                  '📁 ', p._fileName, p._pages ? ` (${p._pages}페이지)` : '',
                  p._error ? ` | ❌ ${p._error}` : '')
              )
            );
          })
        )
      )
    );
  }

  // ── LIST VIEW ──
  if(view === 'list') return h('div',{style:{minHeight:'100vh',background:'linear-gradient(160deg,#f0f4ff 0%,#ffffff 60%)',padding:'20px'}},

          h('div',null, i===0&&h('label',{style:labelStyle},'#'), h('input',{style:{...inputStyle,fontSize:'12px',textAlign:'center'},value:s.itemNo,onChange:e=>updateSurveyItem(i,'itemNo',e.target.value)})),

        ))
      ),
      // ── 메모 ──
      h('div',{style:sectionStyle},
        h('h3',{style:{fontSize:'15px',fontWeight:'bold',color:'#1F3864',marginBottom:'10px'}},'4️⃣ 참고문헌 / 메모'),
        h('textarea',{style:{...inputStyle,height:'80px',resize:'vertical'},value:form.references,onChange:e=>setForm({...form,references:e.target.value}),placeholder:'주요 참고문헌 목록 (줄바꿈으로 구분)'}),
        h('textarea',{style:{...inputStyle,height:'60px',resize:'vertical',marginTop:'8px'},value:form.memo,onChange:e=>setForm({...form,memo:e.target.value}),placeholder:'기타 메모 (특이사항, 한계점 등)'})
      ),
      // ── 저장 버튼 ──
      h('div',{style:{display:'flex',justifyContent:'center',gap:'12px',padding:'20px 0'}},
        h('button',{onClick:handleSave,style:{...btnPrimary,padding:'14px 40px',fontSize:'15px'}}, editIdx !== null ? '💾 수정 저장' : '💾 DB에 저장'),
        h('button',{onClick:()=>{setView('list');setEditIdx(null);setForm(emptyPaper());},style:{...btnSecondary,padding:'14px 30px',fontSize:'14px'}},'취소')
      )
    )
  );
};

// ██  APP  ██
// ══════════════════════════════════════════════════════════════
const App = () => {
  const [mode, setMode] = useState(null);
  if(!mode) return h(HomeScreen, {onSelect:setMode});
  if(mode==='thesis') return h(PaperCompass, {onBack:()=>setMode(null)});
  if(mode==='phd') return h(PhdCompass, {onBack:()=>setMode(null)});
  if(mode==='stats') return h(StatsAnalyzer, {onBack:()=>setMode(null)});
  if(mode==='paperdb') return h(PaperDBBuilder, {onBack:()=>setMode(null)});
  return null;
};

      ReactDOM.render(React.createElement(App), document.getElementById('root'));
    } catch(e) {
      document.getElementById('root').innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap">Error: ' + e.message + '\n\n' + e.stack + '</pre>';
    }
  </script>
</body>
